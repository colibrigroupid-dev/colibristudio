<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2550">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Прототип платформы: житель считает заказ в калькуляторе, видит цену заранее, исполнитель берёт заказ, деньги — в банке до приёмки.">
<title>Прототип платформы заказов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* палитра: ночной синий доминирует, подсолнух — только главное действие и цена */
  --ink:    oklch(0.27 0.075 268);   /* тёмно-синий: текст и тёмные поверхности */
  --ink-2:  oklch(0.36 0.07 268);
  --mute:   oklch(0.50 0.035 268);   /* вторичный текст — оттенок синего, не серый */
  --line:   oklch(0.90 0.012 268);
  --ground: oklch(0.965 0.007 268);  /* фон приложения: светлый, чуть холодный */
  --card:   oklch(0.995 0.002 268);
  --tint:   oklch(0.94 0.025 268);   /* мягкая синяя подложка */
  --sun:    oklch(0.87 0.165 92);    /* подсолнух — главная кнопка */
  --sun-2:  oklch(0.82 0.16 88);
  --ok:     oklch(0.52 0.12 155);
  --ok-soft:oklch(0.95 0.04 155);
  --warn:   oklch(0.55 0.15 55);
  --warn-soft: oklch(0.96 0.04 75);
  --danger: oklch(0.53 0.19 27);
  --danger-soft: oklch(0.96 0.03 27);
  --r: 12px; --pill: 999px;
  --f-head: "Onest", "Golos Text", system-ui, sans-serif;
  --f-text: "Golos Text", "Onest", system-ui, sans-serif;
  --fs: 19px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
.big{ --fs: 22px; }
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--ground); color:var(--ink); font:400 var(--fs)/1.5 var(--f-text); }
::selection{ background:var(--sun); color:var(--ink); }
:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; border-radius:6px; }
button{ font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
svg.i{ width:1.15em; height:1.15em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.2em; }
h1,h2,h3{ font-family:var(--f-head); line-height:1.08; letter-spacing:-0.02em; text-wrap:balance; margin:0; }
h1{ font-size:calc(var(--fs)*1.75); font-weight:800; }
h2{ font-size:calc(var(--fs)*1.3); font-weight:700; }
h3{ font-size:var(--fs); font-weight:700; }
p{ margin:.4em 0; text-wrap:pretty; }
.num{ font-variant-numeric:tabular-nums; }
.mute{ color:var(--mute); } .small{ font-size:.85em; }

/* каркас: на телефоне — весь экран, на компьютере — «телефон» по центру */
.app{ max-width:440px; margin:0 auto; min-height:100svh; background:var(--ground); display:flex; flex-direction:column; position:relative; }
@media (min-width:700px){
  body{ background:oklch(0.88 0.03 268); padding:24px 0; }
  .app{ min-height:calc(100svh - 48px); border-radius:28px; overflow:hidden; box-shadow:0 30px 60px -20px oklch(0.27 0.075 268 / .35); }
}
.top{ display:flex; align-items:center; gap:8px; padding:12px 16px 8px; }
.brand{ display:flex; align-items:center; gap:8px; font:800 1rem/1 var(--f-head); letter-spacing:-0.01em; }
.brand i{ width:28px; height:28px; border-radius:8px; background:var(--ink); display:grid; place-items:center; }
.brand i::after{ content:""; width:10px; height:10px; border-radius:50%; background:var(--sun); }
.top .sp{ flex:1; }
.iconbtn{ min-width:44px; height:44px; border-radius:var(--pill); border:1px solid var(--line); background:var(--card); display:grid; place-items:center; font:700 15px/1 var(--f-head); padding:0 12px; }
.iconbtn[aria-pressed="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }
.roles{ display:flex; gap:4px; margin:0 16px 4px; padding:4px; background:var(--tint); border-radius:var(--pill); }
.roles button{ flex:1; border:0; background:none; border-radius:var(--pill); padding:7px 4px; font:600 13px/1.2 var(--f-head); color:var(--mute); }
.roles button.on{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px oklch(0.27 0.075 268 / .15); }
.demo{ margin:0 16px; font-size:12px; color:var(--mute); text-align:center; }
main{ flex:1; padding:12px 16px 24px; }
.screen{ animation:in .32s var(--ease) both; }
@keyframes in{ from{ opacity:0; transform:translateY(8px); } }
@media (prefers-reduced-motion:reduce){ .screen{ animation:none; } .eta-dot{ animation:none !important; } }

/* кнопки */
.btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:60px; border:0; border-radius:var(--pill); padding:14px 22px;
  font:700 calc(var(--fs)*1.02)/1.2 var(--f-head); text-decoration:none; background:var(--sun); color:var(--ink); transition:transform .15s var(--ease), background-color .15s; }
.btn:active{ transform:scale(.98); }
.btn:hover{ background:var(--sun-2); }
.btn.dark{ background:var(--ink); color:#fff; }
.btn.quiet{ background:var(--card); border:1.5px solid var(--line); min-height:56px; font-weight:600; }
.btn.danger{ background:var(--danger); color:#fff; }
.btn:disabled{ opacity:.45; cursor:default; transform:none; }
.btn small{ font:500 .8em var(--f-text); opacity:.8; }
.stack > * + *{ margin-top:10px; }
.link{ border:0; background:none; color:var(--ink-2); font-weight:600; text-decoration:underline; text-underline-offset:3px; padding:8px 0; min-height:44px; }

/* поверхности */
.card{ background:var(--card); border-radius:var(--r); padding:16px; margin:12px 0; border:1px solid var(--line); }
.note{ border-radius:var(--r); padding:12px 14px; margin:12px 0; background:var(--tint); font-size:.9em; }
.note.ok{ background:var(--ok-soft); } .note.warn{ background:var(--warn-soft); } .note.danger{ background:var(--danger-soft); }
.note b{ font-family:var(--f-head); }
.row{ display:flex; justify-content:space-between; gap:14px; align-items:baseline; padding:6px 0; }
.row > b, .row > .v{ white-space:nowrap; font-variant-numeric:tabular-nums; font-family:var(--f-head); font-weight:600; }
details{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:10px 0; }
details > summary{ list-style:none; cursor:pointer; padding:16px; min-height:56px; display:flex; align-items:center; gap:10px; font:600 var(--fs)/1.3 var(--f-head); }
details > summary::-webkit-details-marker{ display:none; }
details > summary::after{ content:""; margin-left:auto; width:10px; height:10px; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); transform:rotate(45deg) translateY(-3px); transition:transform .2s var(--ease); }
details[open] > summary::after{ transform:rotate(-135deg) translateY(-3px); }
details > div{ padding:0 16px 14px; }
ul.list{ margin:0; padding-left:1.1em; } ul.list li{ margin:6px 0; font-size:.92em; }
.tag{ display:inline-flex; align-items:center; gap:5px; border-radius:var(--pill); padding:4px 10px; font:600 13px/1.2 var(--f-head); background:var(--tint); color:var(--ink-2); margin:3px 4px 3px 0; }
.tag.ok{ background:var(--ok-soft); color:var(--ok); } .tag.warn{ background:var(--warn-soft); color:var(--warn); }

/* главная */
.hero h1{ margin:8px 0 6px; }
.askbox{ background:var(--card); border:2px solid var(--ink); border-radius:20px; padding:6px; margin-top:16px; display:flex; flex-direction:column; }
.askbox textarea{ border:0; resize:none; font:500 calc(var(--fs)*1.05)/1.4 var(--f-text); color:var(--ink); padding:10px 10px 4px; min-height:3.2em; background:none; }
.askbox textarea:focus{ outline:none; }
.askbox .bar{ display:flex; gap:6px; }
.askbox .bar .btn{ min-height:52px; }
.mic{ flex:none; width:52px; min-height:52px; border-radius:var(--pill); border:0; background:var(--ink); color:#fff; display:grid; place-items:center; }
.mic.on{ background:var(--danger); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ box-shadow:0 0 0 8px oklch(0.53 0.19 27 / .2); } }
.chips{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 0; }
.chip{ border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:10px 12px; min-height:56px; font:600 .88em/1.2 var(--f-head); text-align:left; }
.chip.warn{ color:var(--danger); border-color:oklch(0.85 0.06 27); }
.seg{ display:flex; background:var(--tint); border-radius:var(--pill); padding:4px; margin:14px 0 0; }
.seg button{ flex:1; min-height:48px; border:0; background:none; border-radius:var(--pill); font:600 .9em/1.2 var(--f-head); color:var(--mute); }
.seg button.on{ background:var(--ink); color:#fff; }
.promise{ display:grid; gap:10px; margin:22px 0 8px; }
.promise div{ display:flex; gap:12px; align-items:flex-start; font-size:.92em; }
.promise svg{ width:24px; height:24px; color:var(--ok); margin-top:1px; }
.callcard{ display:flex; align-items:center; gap:14px; background:var(--ink); color:#fff; border-radius:var(--r); padding:16px; margin-top:18px; text-decoration:none; }
.callcard .ic{ width:48px; height:48px; border-radius:50%; background:var(--sun); color:var(--ink); display:grid; place-items:center; flex:none; }
.callcard b{ font:700 1.05em var(--f-head); display:block; }
.callcard span{ font-size:.85em; opacity:.8; }

/* диагноз */
.progress{ height:6px; background:var(--tint); border-radius:var(--pill); overflow:hidden; margin:6px 0 4px; }
.progress i{ display:block; height:100%; background:var(--ink); border-radius:var(--pill); transition:width .35s var(--ease); }
.said{ font-size:.9em; color:var(--mute); margin:12px 0 0; }
.said b{ color:var(--ink); font-weight:500; }
.q{ font:700 calc(var(--fs)*1.35)/1.15 var(--f-head); letter-spacing:-0.02em; margin:18px 0 14px; text-wrap:balance; }
.opts{ display:flex; flex-direction:column; gap:10px; }
.opt{ text-align:left; border:2px solid var(--line); background:var(--card); border-radius:16px; padding:16px 18px; min-height:64px; font:600 var(--fs)/1.3 var(--f-head); display:flex; align-items:center; gap:12px; transition:border-color .15s, background-color .15s; }
.opt:hover{ border-color:var(--ink); }
.opt.sel{ border-color:var(--ink); background:var(--tint); }
.opt small{ display:block; font:400 .82em/1.3 var(--f-text); color:var(--mute); margin-top:2px; }
.opt .tx{ flex:1; }
.answers{ margin:16px 0 0; display:flex; flex-direction:column; gap:6px; }
.answers button{ display:flex; gap:10px; align-items:flex-start; text-align:left; border:0; background:none; padding:6px 0; font-size:.88em; color:var(--mute); min-height:40px; }
.answers button b{ color:var(--ink); font-weight:600; }
.answers svg{ color:var(--ok); margin-top:3px; }
.learn{ font-size:.85em; background:var(--ok-soft); border-radius:10px; padding:8px 12px; margin:-2px 0 4px 26px; }
.stepper{ display:flex; align-items:center; justify-content:center; gap:18px; margin:8px 0 18px; }
.stepper button{ width:64px; height:64px; border-radius:50%; border:2px solid var(--ink); background:var(--card); font:700 28px/1 var(--f-head); }
.stepper b{ font:800 40px/1 var(--f-head); min-width:110px; text-align:center; font-variant-numeric:tabular-nums; }

/* цена — билет, как в такси */
.ticket{ margin:14px 0 4px; filter:drop-shadow(0 18px 24px oklch(0.27 0.075 268 / .18)); }
.ticket .t-top{ background:var(--ink); color:#fff; border-radius:20px 20px 0 0; padding:20px 20px 22px; position:relative; }
.ticket .lock{ display:inline-flex; align-items:center; gap:6px; background:oklch(1 0 0 / .12); color:var(--sun); border-radius:var(--pill); padding:6px 12px; font:600 13px/1 var(--f-head); }
.ticket .price{ font:800 clamp(52px, 15vw, 64px)/1 var(--f-head); letter-spacing:-0.035em; color:var(--sun); margin:14px 0 6px; font-variant-numeric:tabular-nums; }
.ticket .what{ font-size:.92em; opacity:.85; }
.ticket .t-perf{ height:22px; background:
   radial-gradient(circle at 0 50%, transparent 11px, var(--card) 11.5px) left / 51% 100% no-repeat,
   radial-gradient(circle at 100% 50%, transparent 11px, var(--card) 11.5px) right / 51% 100% no-repeat; position:relative; }
.ticket .t-perf::after{ content:""; position:absolute; left:20px; right:20px; top:50%; border-top:2px dashed var(--line); }
.ticket .t-bot{ background:var(--card); border-radius:0 0 20px 20px; padding:6px 20px 16px; font-size:.92em; }
.ticket .t-bot .row{ padding:5px 0; }
.ticket .t-bot .row span{ color:var(--mute); }
.ticket .t-bot .sum{ border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
.ticket .t-bot .sum span{ color:var(--ink); font-weight:600; }
.addmore{ display:flex; align-items:center; gap:12px; width:100%; border:2px dashed oklch(0.75 0.04 268); background:none; border-radius:16px; padding:14px 16px; margin:14px 0 0; text-align:left; min-height:60px; }
.addmore .ic{ width:36px; height:36px; border-radius:50%; background:var(--tint); display:grid; place-items:center; flex:none; }
.addmore b{ font:700 .95em var(--f-head); display:block; }
.addmore span{ font-size:.82em; color:var(--mute); }

/* мастер */
.who{ display:flex; gap:14px; align-items:center; }
.ava{ width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center; font:800 22px var(--f-head); color:var(--ink);
  background:conic-gradient(from 210deg, var(--sun), oklch(0.9 0.08 150), var(--sun)); }
.who b{ font:700 1.05em var(--f-head); }
.stars{ color:oklch(0.75 0.16 80); }

/* закреплённая кнопка внизу */
.dock{ position:sticky; bottom:0; margin:16px -16px -24px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--ground) 70%, transparent); }
.dock .hint{ text-align:center; font-size:.78em; color:var(--mute); margin-top:6px; display:flex; gap:6px; justify-content:center; align-items:center; }

/* отслеживание */
.map{ position:relative; height:190px; border-radius:var(--r); overflow:hidden; margin:12px 0; background:
   linear-gradient(90deg, transparent 47%, oklch(0.99 0 0) 47% 53%, transparent 53%) 0 0 / 120px 100%,
   linear-gradient(0deg, transparent 46%, oklch(0.99 0 0) 46% 54%, transparent 54%) 0 0 / 100% 80px,
   oklch(0.93 0.02 140); }
.map .home{ position:absolute; right:22%; top:38%; width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; box-shadow:0 0 0 6px oklch(0.27 0.075 268 / .15); }
.map .eta-dot{ position:absolute; width:22px; height:22px; border-radius:50%; background:var(--sun); border:3px solid var(--ink); left:12%; top:70%; animation:drive 8s var(--ease) infinite alternate; }
@keyframes drive{ to{ left:68%; top:44%; } }
.map .eta{ position:absolute; left:12px; top:12px; background:var(--card); border-radius:var(--pill); padding:8px 14px; font:700 15px var(--f-head); box-shadow:0 4px 12px oklch(0.27 0.075 268 / .15); }
.code{ font:800 34px/1 var(--f-head); letter-spacing:.02em; text-align:center; padding:18px; border-radius:16px; background:var(--sun); color:var(--ink); margin:10px 0; }
ol.steps{ list-style:none; padding:0; margin:10px 0; }
ol.steps li{ position:relative; padding:4px 0 14px 34px; color:var(--mute); font-size:.92em; }
ol.steps li::before{ content:""; position:absolute; left:4px; top:7px; width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:var(--card); }
ol.steps li::after{ content:""; position:absolute; left:11px; top:25px; bottom:0; width:2px; background:var(--line); }
ol.steps li:last-child::after{ display:none; }
ol.steps li.done{ color:var(--ink); } ol.steps li.done::before{ background:var(--ok); border-color:var(--ok); }
ol.steps li.now{ color:var(--ink); font-weight:600; } ol.steps li.now::before{ border-color:var(--ink); box-shadow:0 0 0 5px var(--tint); }
.photos{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
.ph{ aspect-ratio:4/3; border-radius:10px; display:grid; place-items:center; font:700 13px var(--f-head); color:var(--mute); background:repeating-linear-gradient(45deg, var(--tint), var(--tint) 10px, var(--card) 10px, var(--card) 20px); }
.ph.after{ background:repeating-linear-gradient(45deg, var(--ok-soft), var(--ok-soft) 10px, var(--card) 10px, var(--card) 20px); color:var(--ok); }
.rate{ display:flex; gap:4px; }
.rate button{ border:0; background:none; padding:4px; color:var(--line); }
.rate button.on{ color:oklch(0.75 0.16 80); }
.rate svg{ width:40px; height:40px; fill:currentColor; stroke:none; }
.toggle{ display:flex; gap:14px; align-items:flex-start; cursor:pointer; }
.toggle input{ width:26px; height:26px; margin:2px 0 0; accent-color:var(--ink); flex:none; }
.catbtn{ display:flex; align-items:center; justify-content:space-between; width:100%; border:0; border-bottom:1px solid var(--line); background:none; padding:16px 2px; min-height:58px; font:600 var(--fs)/1.3 var(--f-head); text-align:left; }
.catbtn:last-child{ border-bottom:0; }
.catbtn .v{ font:600 .85em var(--f-head); color:var(--mute); white-space:nowrap; font-variant-numeric:tabular-nums; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.stats div{ background:var(--tint); border-radius:10px; padding:10px 8px; text-align:center; }
.stats b{ display:block; font:800 1.15em/1.1 var(--f-head); font-variant-numeric:tabular-nums; }
.stats span{ font-size:.72em; color:var(--mute); line-height:1.2; display:block; margin-top:2px; }
.checks{ display:grid; gap:10px; margin:12px 0 6px; }
.tagpick{ display:flex; flex-wrap:wrap; gap:8px; }
.tagpick button{ border:1.5px solid var(--line); background:var(--card); border-radius:var(--pill); padding:10px 14px; min-height:44px; font:600 .85em var(--f-head); }
.tagpick button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.qtyinp{ display:flex; align-items:center; gap:10px; justify-content:center; margin:10px 0 6px; }
.qtyinp input{ width:150px; font:800 32px/1 var(--f-head); text-align:center; padding:12px; border:2px solid var(--ink); border-radius:16px; background:var(--card); color:var(--ink); font-variant-numeric:tabular-nums; }
.qtyinp span{ font:700 20px var(--f-head); }
details.izm{ margin:12px 0; } details.izm p{ font-size:.86em; margin:.5em 0; } details.izm .primer{ background:var(--tint); border-radius:10px; padding:8px 10px; }
.back{ display:inline-flex; align-items:center; gap:6px; border:0; background:none; padding:8px 0; min-height:44px; font:600 .95em var(--f-head); color:var(--ink-2); }
</style>
</head>
<body>
<div class="app" id="root">
  <div class="top">
    <div class="brand"><i></i><span id="brandname">Платформа</span></div><div class="sp"></div>
    <button class="iconbtn" id="gorodbtn" onclick="set({step:'gorod',strana:null})" aria-label="Сменить город"></button>
    <button class="iconbtn" id="bigbtn" aria-pressed="false" aria-label="Крупный текст" onclick="toggleBig()">А+</button>
  </div>
  <div class="roles" id="roles"></div>
  <div class="demo">Демо-прототип: мастер, оплата и цены учебные; в демо часть каталога, ИИ-помощник отключён</div>
  <main id="app"></main>
</div>
<script>

сть); в рулоне полос = длина рулона ÷ длина полосы, округлить вниз; рулонов = полосы ÷ полос в рулоне, округлить вверх.", "primer": "Комната 3×4 м, высота 2,7 м. Периметр = (3+4)×2 = 14 м. Площадь стен = 14 × 2,7 = 37,8 м². Окно 1,5×1,4 = 2,1 м². Дверь 0,8×2 = 1,6 м². Оклейка = 37,8 − 2,1 − 1,6 = 34,1 м². Работа по прайсу: 34,1 × цена за м². Рулонов (шир. 1,06 м, длина 10 м, без рисунка): 14 ÷ 1,06 ≈ 13,2 → 14 полос; в рулоне 10 ÷ 2,7 = 3 полосы; 14 ÷ 3 ≈ 4,7 → 5 рулонов.", "vychitat": "Окна и двери шире 60 см вычитаются полностью. Проёмы уже 60 см считаются как ровная стена (не вычитаются). Порог «больше 2 м²» по прайсам не подтвердился: сверить у мастера.", "uzkie_mesta": "Узкую полосу у окна или угла (30–60 см) обычно клеят как часть стены, отдельно её в погонных метрах не считают. Но в ряде прайсов такие полосы берут в погонных метрах по высоте. Это принято у мастеров, сверить. Откосы окна и сам подоконник в площадь обоев не входят, их считают отдельной работой.", "kogda_zamer": "Если стены кривые, потолок с уклоном, есть эркер, арка или много ниш, если рисунок крупный с шагом, или если сумма заказа больше 30 000 ₽. В этих случаях мастер приезжает на замер."}, "tg": 900, "tgO": true}, {"id": "otd.lamin", "kat": "Мелкая отделка", "name": "Укладка ламината (за м²)", "phr": ["положить ламинат", "уложить ламинат", "постелить ламинат"], "ed": "м²", "base": 450, "mins": 15, "qty": "n", "qty0": 1, "min": 1500, "rynok": 350, "q": [{"q": "Ламинат куплен?", "o": ["Да", "Нет — подберём"], "e": [{"add": 0, "pct": 0, "chek": false, "slozhno": false, "pochemu": ""}, {"add": 0, "pct": 0, "chek": true, "slozhno": false, "pochemu": "ламинат по чеку, берём запас 10 % на подрезку"}]}, {"q": "Основание?", "o": ["Ровный бетон", "Старый пол — снимаем", "Не знаю"], "e": [{"add": 0, "pct": 0, "chek": false, "slozhno": false, "pochemu": ""}, {"add": 0, "pct": 0, "chek": false, "slozhno": true, "pochemu": "старый пол: демонтаж, сумму назовём после осмотра"}, {"add": 0, "pct": 0, "chek":   return {items, sum, min, minUsed: min>sum, w, fl, total, slozhno: items.some(x=>x.slozhno)};
}
const total = () => visit().total + (S.extraOk ? S.extra : 0);
const title = () => S.cart.map(it=>it.job.name).join(' + ');

/* =================== голос =================== */
function voice(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { alert('В этом браузере голосовой ввод не работает. В продукте можно будет позвонить и сказать голосом.'); return; }
  const r = new R(); r.lang = 'ru-RU'; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = e => { const t = e.results[0][0].transcript; set({listening:false}, true); const ta = $('#q'); if (ta) ta.value = t; ask(t); };
  r.onerror = r.onend = () => { if (S.listening) set({listening:false}, true); };
  set({listening:true}, true); r.start();
}

/* =================== помощник: понять и расспросить =================== */
function ask(text){
  text = (text||'').trim(); if (!text) return;
  if (GAS2.test(text)) return set({step:'danger', said:text, job:null, gas:true, dangerText:
    'Запах газа, дым или огонь — это опасно, мастер здесь не поможет. Сразу звоните 104 (газ) или 112. Откройте окна, не включайте свет и не пользуйтесь огнём, выйдите из квартиры.'});
  if (GASWORK.test(text)) return set({step:'danger', said:text, job:null, gas:true, dangerText:
    'Всё, что связано с газом — плита, колонка, котёл, кран, счётчик, — по закону делает только газовая служба. Частных мастеров мы к газу не направляем. Если пахнет газом — сразу звоните 104.'});
  if (OBSCHEE.test(text)) return set({step:'danger', said:text, job:null, gas:false, dangerText:
    'Стояки, общий щиток в подъезде и крыша — общее имущество дома. Звоните в ' + G().uk + ': это их работа, для вас бесплатно. Если течёт сильно — звоните в аварийную службу дома, она работает круглосуточно.'});
  let warn = '';
  if (SHOCK.test(text)) warn = 'Пока ждёте мастера: отключите этот автомат в щитке или выньте вилку и не трогайте розетку.';
  if (FLOOD.test(text)) warn = 'Сейчас же перекройте воду: кран под раковиной или общий кран у счётчиков. Если течёт из стояка или от соседей — звоните в ' + G().uk + '.';
  if (AI && !S.noAi) return askAi(text, warn);
  return askWords(text, warn);
}
// Живой помощник: страница открыта с сервера (server/server.py). Ключ модели — только на сервере.
const AI = false;   // в демо ИИ-сервера нет — подбор по словам
async function askAi(text, warn){
  set({thinking:true, said:text}, true);
  try {
    const r = await fetch('/api/pomoshnik', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}),
      signal: AbortSignal.timeout ? AbortSignal.timeout(20000) : undefined});   // дольше 20 с не ждём — подбор по словам
    if (!r.ok) throw new Error(r.status);
    const a = await r.json();
    const now = [warn, a.seychas].filter(Boolean).join(' ');
    S.thinking = false; S.aiSaid = a.otvet || '';
    if (a.tip==='opasno') {
      const z = (a.ids||[]).map(byId).find(j=>j && (j.opas==='zapret' || j.base==null));
      if (z) return startJob(z.id, text, now);
      return set({step:'danger', said:text, job:null, gas:!!a.gas || GASWORK.test(text), dangerText: a.gas || GASWORK.test(text)
        ? 'Запах газа, дым или огонь — это опасно, мастер здесь не поможет. Сразу звоните 104 (газ) или 112. Откройте окна, не включайте свет и не пользуйтесь огнём.'
        : (a.otvet || 'Эту работу частный мастер не делает. Оператор подскажет, к кому обратиться.')});
    }
    if (a.tip==='rabota' && a.ids.length===1) return startJob(a.ids[0], text, now, a.ids, a.znaem||{});
    return set({step:'clarify', said:text, cands:a.ids||[], warn:now, vopros:a.vopros||'', netV: a.tip==='net_v_kataloge'});
  } catch(e) {
    S.thinking = false;
    return askWords(text, warn);   // сервер или модель недоступны — подбор по словам
  }
}
// выбор из уточнения: ИИ отмечает ответы, которые человек уже назвал в рассказе
async function pick(id){
  if (AI && !S.noAi && S.said) {
    set({thinking:true}, true);
    try {
      const r = await fetch('/api/znaem', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:S.said, id}),
        signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined});
      const z = r.ok ? (await r.json()).znaem || {} : {};
      S.thinking = false; return startJob(id, S.said, S.warn, S.cands, z);
    } catch(e) { S.thinking = false; }
  }
  startJob(id, S.said, S.warn, S.cands);
}
function askWords(text, warn){
  S.vopros = ''; S.netV = false; S.aiSaid = '';
  const m = match(text);
  if (!m.length) return set({step:'clarify', said:text, cands:[], warn});
  const cands = m.map(x=>x.j.id);
  // сразу ведём к работе только при уверенном совпадении; первый экран всё равно спросит «верно?»
  if (m[0].s >= 0.9 && (m.length===1 || m[0].s - m[1].s >= 0.25)) return startJob(m[0].j.id, text, warn, cands);
  set({step:'clarify', said:text, cands, warn});
}
const effVal = (e, base) => R(e.add||0) + (e.pct||0)*base/100;
function startJob(id, said=S.said, warn=S.warn, cands=[], znaem={}){
  const j0 = byId(id);
  if (j0.opas==='zapret' || j0.base==null) return set({step:'danger', said, job:j0, warn, gas:GASWORK.test(j0.name+' '+(j0.kuda||'')), dangerText:
    `«${j0.name}» — эту работу мы не передаём частным мастерам: это опасно, и по закону её делает только профильная служба. Куда обратиться: ${j0.kuda || 'управляющая компания или профильная служба'}.`});
  if (S.cart.length && j0.min !== S.cart[0].job.min) return set({step:'separate', said, job:j0});
  // «Не знаю» есть в каждом вопросе, где ответ меняет цену: берём худший вариант, на месте цена только снизится
  const hoursQ = j0.qty==='chas' ? j0.q.find(q => /сколько (часов|времени)/i.test(q.q)) : null;
  const hoursDisc = hoursQ ? Math.min(0, ...hoursQ.e.map(e=>e.pct||0)) : 0;
  const jq = j0.q.map((q,oi)=>({...q, oi})).filter(q => j0.q[q.oi]!==hoursQ).map(q => {
    if (q.o.some(o=>/не знаю/i.test(o)) || !q.e.some(e=>effVal(e,CENA(j0))||e.slozhno)) return q;
    const w = q.e.reduce((a,e)=> effVal(e,CENA(j0)) > effVal(a,CENA(j0)) ? e : a, q.e[0]);
    return {...q, o:[...q.o,'Не знаю'], e:[...q.e, {...w, pochemu: w.pochemu ? 'Заложили на всякий случай: '+w.pochemu.replace(/^Заложили на всякий случай:\s*/,'') : ''}]};
  });
  const j = {...j0, q:jq, hoursDisc};
  const ownFloor = jq.some(q => /этаж|лифт/i.test(q.q));
  // ответы, которые человек уже назвал в рассказе (отметил ИИ), идут первыми и уже отвечены
  const ans = jq.map(q => Number.isInteger(znaem[q.oi]) && znaem[q.oi] < q.o.length ? znaem[q.oi] : null);
  const pre = new Set(jq.map((q,i)=>ans[i]!=null ? i : -1).filter(i=>i>=0));
  const qs = [...jq.map((q,i)=>({kind:'job', i, q:q.q, o:q.o, pre:pre.has(i)}))].sort((a,b)=>b.pre-a.pre);
  if (j.qty) qs.push({kind:'qty', q: j.qty==='chas' ? 'Сколько часов нужно?' : 'Сколько нужно?'});
  if (S.floor==null && HEAVY.has(j.kat) && !ownFloor) qs.push({kind:'floor', q:'Какой этаж и есть ли лифт?', o:FLOOR.map(f=>f.t), sub:FLOOR.map(f=>f.s||'')});
  if (S.when==null) qs.push({kind:'when', q:'Когда нужен мастер?', o:WHEN.map(w=>w.t), sub:WHEN.map(w=>w.s)});
  // если ИИ ответил на всё и это заказ из одного шага — всё равно покажем последний вопрос, чтобы человек проверил
  set({step:'diag', said, job:j, qs, qi:Math.min(pre.size, qs.length-1), ans, qty:j.qty0||1, photo:false, warn, cands, stop:''});
}
function answer(k){
  const q = S.qs[S.qi];
  if (q.kind==='job') {
    S.ans[q.i] = k;
    const e = S.job.q[q.i].e[k];
    // ответ, который означает «это не для частного мастера», останавливает заказ
    if (e && e.slozhno && STOP_ANS.test(e.pochemu||'')) return set({stop:e.pochemu}, true);
  }
  else if (q.kind==='floor') S.floor = k;
  else if (q.kind==='when') S.when = k;
  S.stop = '';
  const qi = S.qi + 1;
  if (qi >= S.qs.length) return set({qi, cart:[...S.cart, {job:S.job, ans:[...S.ans], qty:S.qty}], step:'offer'});
  set({qi}, true);
}
function goBack(){
  if (S.qi > 0) return set({qi:S.qi-1}, true);
  set({step: S.cart.length ? 'offer' : 'home'});
}
function ansText(q){
  if (q.kind==='job') return S.ans[q.i]==null ? null : q.o[S.ans[q.i]];
  if (q.kind==='qty') return `${S.qty} ${S.job.qty==='chas'?'ч':S.job.ed}`;
  if (q.kind==='floor') return S.floor==null ? null : q.o[S.floor];
  if (q.kind==='when') return S.when==null ? null : q.o[S.when];
}
function effOf(q){ return q.kind==='job' && S.ans[q.i]!=null ? S.job.q[q.i].e[S.ans[q.i]] : null; }

      <div class="tagpick">${TEG_KLIENT.map(t=>`<button class="${S.mtags.includes(t)?'on':''}" onclick="toggleTag('${t}','mtags')">${t}</button>`).join('')}</div></div>`;
  if (S.step==='cancelled') return head+`<div class="note warn"><b>Заказчик отменил заказ.</b> ${S.cancelFee?`Вам начислено ${rub(S.cancelFee)} за потраченное время.`:'Вы ещё не выехали — без компенсации.'}</div>`;
  if (S.step==='dispute') return head+`<div class="note warn">Заказчик открыл спор. Выплата на паузе, с вами свяжется оператор.</div>`;
  const b = (t,n,extra='')=>head+extra+`<div class="dock"><button class="btn" onclick="set({mStep:'${n}'})">${t}</button></div>`;
  switch(S.mStep){
    case 'feed': return b('Беру заказ','way',`<div class="note ok">Деньги заказчика уже в банке — работа будет оплачена.</div>
      <div class="card"><div class="row"><span>Заказчик</span><span class="tag ok">${I('check')} Надёжный заказчик</span></div>
      <p class="small mute">6 оплаченных заказов, отмен в последний момент нет. Если заказчик отменит после вашего выезда — получите ${rub(R(300))}, если не откроет дверь — минимальный заказ.</p></div>`);
    case 'way': return b('Я на месте','arrived','<div class="note">Не берите наличные и не просите перевод на карту — за это аккаунт закрывается.</div>');
    case 'arrived': return b('Назвал слово, начинаю','work',`<p>Назовите заказчику кодовое слово:</p><div class="code">${MASTER.code}</div><div class="card"><h3>Селфи на месте и фото «до»</h3><div class="photos"><div class="ph">СЕЛФИ · снято</div><div class="ph">ДО · снято</div></div></div>`);
    case 'work': return head + (S.extraAsk?'<div class="note warn">Запрос на доплату отправлен. Ждём ответа заказчика.</div>':
        S.extraOk?'<div class="note ok">Доплата согласована.</div>':
        S.extraUsed?'<div class="note">Доплату уже запрашивали в этом заказе. Если нужно ещё — через оператора.</div>':
        `<div class="card"><h3>Нужна доплата?</h3><p class="small mute">Сфотографируйте деталь — заказчик увидит фото и сумму. Один запрос на заказ.</p>
          <div class="chips">${[300,500,700,1000].map(R).map(a=>`<button class="chip" style="text-align:center;font-size:1em" onclick="set({extra:${a},extraAsk:true,extraUsed:true,extraWhy:'Нужно заменить изношенную деталь, без неё работа не продержится.'},true)">${rub(a)}</button>`).join('')}</div></div>`)
        + `<div class="card"><h3>Фото «после»</h3><div class="photos"><div class="ph after">ПОСЛЕ · снято</div></div></div>
        <div class="dock"><button class="btn" ${S.extraAsk?'disabled':''} onclick="set({mStep:'done'})">Работа готова</button></div>`;
    case 'done': return head+'<div class="note">Ждём, когда заказчик примет работу. Не ответит за 24 часа — выплата пройдёт сама.</div>';
  }
}

/* =================== экран близкого человека =================== */
function vTrusted(){
  if (!ACTIVE()) return `<h1>Заказы мамы</h1><div class="note">Сейчас активных заказов нет. Когда мама вызовет мастера, здесь будет видно, кто едет, цена и каждый шаг.</div>`;
  if (!S.trusted) return `<h1>Заказы мамы</h1><div class="note">В этом заказе доступ близкому человеку выключен.</div>`;
  const decide = S.extra>R(500) ? extraBox('trusted') : '';
  return `${decide?`<div class="note warn" style="font-size:1em"><b>Нужно ваше решение</b></div>${decide}`:''}
  <h1>Заказ мамы</h1>
  <p class="mute small">${esc(title())}</p>
  ${mapBox()}
  <div class="card"><div class="row"><span>Цена</span><b>${rub(total())}</b></div>
   <div class="who" style="margin-top:10px"><div class="ava">${MASTER.ini}</div><div><b>${MASTER.name}</b><br><span class="mute small"><span class="stars">★</span> ${MASTER.rate} · паспорт проверен</span></div></div></div>
  ${S.step==='dispute'?'<div class="note warn">Открыт спор, деньги в банке, работает оператор.</div>':''}
  ${timeline()}
  <div class="stack"><a class="btn quiet" href="tel:${G().tel}">${I('phone')} Позвонить мастеру через сервис</a></div>`;
}

/* =================== сборка =================== */
function vSeparate(){
  return `<button class="back" onclick="set({step:'offer'})">${I('back')} К заказу</button>
    <div class="q">Это другой специалист</div>
    <p>«${esc(S.job.name)}» делает не тот мастер, что уже едет к вам. Оформим это отдельным заказом, когда закончите текущий.</p>
    <div class="stack"><button class="btn" onclick="set({step:'offer'})">Вернуться к заказу</button></div>`;
}
/* =================== система доверия =================== */
function cancelOrder(){
  // до выезда — бесплатно; мастер едет — 300 ₽ за дорогу; мастер у двери — минимальный заказ
  const fee = S.mStep==='feed' ? 0 : S.mStep==='way' ? R(300) : MIN(S.cart[0].job);
  const msg = fee ? `Мастер уже ${S.mStep==='way'?'едет':'у двери'}. При отмене ${rub(fee)} уйдёт мастеру за потраченное время, остальное вернёт банк. Отменить?`
                  : 'Мастер ещё не выехал — отмена бесплатная, банк вернёт всю сумму. Отменить?';
  if (confirm(msg)) set({step:'cancelled', cancelFee:fee});
}
function vCancelled(){
  return `<h2 style="margin:6px 0 10px">Заказ отменён</h2>
    <div class="note">${S.cancelFee?`${rub(S.cancelFee)} ушли мастеру за потраченное время. Остальное — ${rub(total()-S.cancelFee)} — банк вернёт на карту в течение 1–3 дней.`:`Банк вернёт всю сумму — ${rub(total())} — на карту в течение 1–3 дней.`}</div>
    <button class="btn" onclick="set(fresh())">Новая заявка</button>`;
}
function toggleTag(t, key='tags'){ const a = S[key]; set({[key]: a.includes(t) ? a.filter(x=>x!==t) : [...a, t]}, true); }
function vGorod(){
  const st = STRANY.find(x=>x.id===S.strana);
  if (!st) return `${S.gorod?`<button class="back" onclick="set({step:'home'})">${I('back')} Назад</button>`:''}
    <h1 style="margin-top:8px">Где вы живёте?</h1>
    <p class="mute">Цены, мастера и телефоны — для вашего города.</p>
    <div class="opts" style="margin-top:16px">${STRANY.map(x=>`<button class="opt" onclick="set({strana:'${x.id}'},true)"><span class="tx">${x.name}<small>${x.goroda.filter(g=>g.on).map(g=>g.name).join(', ')}${x.goroda.some(g=>!g.on)?' — уже работаем':''}</small></span>${I('next')}</button>`).join('')}</div>`;
  return `<button class="back" onclick="set({strana:null},true)">${I('back')} ${st.name}</button>
    <h1 style="margin-top:8px">Ваш город</h1>
    <div class="opts" style="margin-top:16px">${st.goroda.map(g=>{
      const gotov = g.on && (g.id!=='almaty' || almatyGotov());
      return gotov ? `<button class="opt" onclick="setGorod('${g.id}')"><span class="tx">${g.name}</span>${I('next')}</button>`
                   : `<button class="opt" disabled style="opacity:.55"><span class="tx">${g.name}<small>${g.on?'готовим цены — скоро':'скоро откроемся'}</small></span></button>`;
    }).join('')}</div>
    <p class="small mute" style="margin-top:14px">Нет вашего города? Позвоните — запишем и сообщим, когда откроемся.</p>`;
}
const VIEWS = {gorod:vGorod, home:vHome, kat:vKat, clarify:vClarify, diag:vDiag, offer:vOffer, danger:vDanger, track:vTrack, closed:vClosed, dispute:vDispute, human:vHuman, separate:vSeparate, cancelled:vCancelled};
function render(){
  $('#roles').innerHTML = [['client','Заказчик'],['master','Мастер'],['trusted','Близкий']]
    .map(([k,t])=>`<button class="${S.role===k?'on':''}" onclick="set({role:'${k}'})">${t}</button>`).join('');
  const gb = $('#gorodbtn'); gb.textContent = S.gorod ? G().name : 'Город'; gb.style.display = S.step==='gorod' ? 'none' : '';
  const v = S.step==='gorod' ? vGorod() : S.role==='master' ? vMaster() : S.role==='trusted' ? vTrusted() : VIEWS[S.step]();
  $('#app').innerHTML = `<div class="screen">${v}</div>`;
  // название — по стране: Россия «Рукастый», Казахстан «Шебер»
  const brand = 'Платформа';
  $('#brandname').textContent = brand;
  document.title = 'Прототип платформы заказов';
}
render();
</script>
</body>
</html>
