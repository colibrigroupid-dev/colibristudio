<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Материалы по коду</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
/* Монтажный стол: тёмная палата вечером. Стена палаты в фоне, штора в акценте. Один тёмный вид. */
:root{
  --bg:#12191d;--surface:#1b2429;--line:#2e3a41;--fg:#e8edeb;--muted:#9fb0b5;--accent:#e6b866;--accent-ink:#1b1408;--bad:#e58b7b;
  --display:"Oswald","Arial Narrow",sans-serif;--body:"Golos Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1500px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 clamp(30px,5vw,48px)/1.1 var(--display);letter-spacing:.01em;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--muted);max-width:68ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin:20px 0 8px}
button{font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font:500 13px var(--mono);color:var(--accent);margin-left:auto}
.status{font-size:13px;color:var(--muted);width:100%}
h2{font:500 26px/1.2 var(--display);letter-spacing:.015em;margin:38px 0 4px;text-wrap:balance}
h3{font:500 20px/1.2 var(--display);letter-spacing:.02em;margin:26px 0 10px;color:var(--accent)}
.note{color:var(--muted);margin:0 0 14px;max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.item{display:flex;flex-direction:column;min-width:0;gap:8px}
.frame{all:unset;display:block;position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border:1px solid var(--line);cursor:zoom-in;overflow:hidden}
.frame:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.frame .play{position:absolute;left:8px;bottom:8px;font:500 12px var(--mono);background:rgba(0,0,0,.72);color:#fff;padding:3px 7px;border-radius:3px}
.item.on .frame{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.name{font-weight:600;line-height:1.3}
.txt{margin:0;font-size:14px;color:var(--fg)}
.txt b{font-weight:500;color:var(--muted)}
.price{font:500 12px var(--mono);color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:2px}
.lb{position:fixed;inset:0;z-index:20;background:#05080a;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-view{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
.lb-view img,.lb-view video{max-width:100%;max-height:100%;display:block}
.lb-view.zoom{display:block}
.lb-view.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.lb-view img{cursor:zoom-in}
.lb-info{background:var(--surface);border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.lb-text{flex:1 1 320px;min-width:0;font-size:14px}
.lb-text .txt{font-size:14px}
.lb-btns{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:no-preference){.frame img{transition:opacity .15s}.frame:hover img{opacity:.88}}
.gate{max-width:360px;margin:18vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
.gate label{font:500 22px var(--display)}
.gate input{font:500 16px var(--mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.gate-msg{margin:0;color:var(--bad);min-height:1.5em;font-size:14px}
.sum{max-width:78ch}
.sum-row{margin:0 0 12px}
.sum-row b{font-weight:600}
.pnote{margin-top:22px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px;margin:0 0 16px;max-width:980px;min-width:0}
.pcard h3{margin:0 0 6px}
.pset{margin:0 0 12px;color:var(--muted);font-size:14px}
.pwhere{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 12px;font-size:14px}
.pwhere dt{font-weight:600}
.pwhere dd{margin:0;min-width:0}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;font:500 13px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 12px;max-height:340px;overflow:auto}
.btn{font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
.btn:hover{border-color:var(--muted)}
.mats{max-width:980px}
@media(max-width:560px){.pwhere{grid-template-columns:1fr}.pwhere dd{margin-bottom:6px}}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.hlab{font:500 14px var(--body);color:var(--muted)}
.htools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px}
.hitem{display:flex;flex-direction:column;gap:5px;min-width:0;padding:6px;border:2px solid transparent;border-radius:8px}
.hitem.keep{border-color:#6fbf8a;background:rgba(111,191,138,.1)}
.hitem.del{border-color:var(--bad);background:rgba(229,139,123,.1)}
.hitem.del img{opacity:.35}
.hframe{all:unset;display:block;aspect-ratio:4/3;width:100%;background:#000;cursor:zoom-in;overflow:hidden;border-radius:4px}
.hframe:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hframe img{width:100%;height:100%;object-fit:contain;display:block}
.hid{font:500 15px var(--mono);color:var(--accent)}
.hname{font-size:12px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.hb{padding:5px 4px;font-size:13px;min-height:34px}
.hb.keep[aria-pressed=true]{background:#6fbf8a;color:#10231a;border-color:#6fbf8a}
.hb.del[aria-pressed=true]{background:var(--bad);color:#2a120d;border-color:var(--bad)}
</style>
</head><body>
<form id="gate" class="gate"><label for="code">Код доступа</label><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit">Открыть</button><p id="gateMsg" class="gate-msg" role="status"></p></form>
<div class="wrap" id="app" hidden>
  <h1>Финал «Тоқылдақ»: итог проб</h1>
  <p class="lead">Что проверили, что работает, промпты и все материалы для продолжения.</p>
  <div class="bar">
    <button id="tabSum" aria-pressed="true">Итог</button>
    <button id="tabPrompts" aria-pressed="false">Промпты</button>
    <button id="tabGen" aria-pressed="false">Генерации</button>
    <button id="tabCards" aria-pressed="false">Карты героев</button>
    <button id="tabMat" aria-pressed="false">3D и материалы</button>
    <button id="onlyPicked" aria-pressed="false">Только отмеченные</button>
    <button id="copyPicks">Скопировать выбранное</button>
    <span class="count" id="count">Отмечено: 0</span>
    <span class="status" id="status" hidden></span>
  </div>
  <div id="root"></div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр">
  <div class="lb-view" id="lbView"></div>
  <div class="lb-info">
    <div class="lb-text" id="lbText"></div>
    <div class="lb-btns">
      <button id="lbPrev" aria-label="Предыдущий">←</button>
      <button id="lbNext" aria-label="Следующий">→</button>
      <button id="lbPick" aria-pressed="false">☆ Отметить</button>
      <button id="lbSave">Скачать</button>
      <button id="lbClose">Закрыть</button>
    </div>
  </div>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null; const urls=new Map();
const TYPES={jpg:'image/jpeg',mp4:'video/mp4',zip:'application/zip'};
async function dec(buf){ return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},KEY,buf.slice(12)); }
async function blobUrl(f){
  if(urls.has(f)) return urls.get(f);
  const p=(async()=>{ const r=await fetch(f); if(!r.ok) throw new Error('load'); const plain=await dec(new Uint8Array(await r.arrayBuffer()));
    const ext=f.replace('.bin','').split('.').pop(); return URL.createObjectURL(new Blob([plain],{type:TYPES[ext]||'application/octet-stream'})); })();
  urls.set(f,p); p.catch(()=>urls.delete(f)); return p;
}
async function unlock(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
  KEY=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(GATE.salt),iterations:GATE.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await dec(b64(GATE.data))));
}
async function enter(code,quiet){
  try{ const d=await unlock(code); try{ sessionStorage.setItem('tok-final-code',code); }catch(e){}
    document.getElementById('gate').hidden=true; document.getElementById('app').hidden=false; boot(d); }
  catch(e){ if(!quiet) document.getElementById('gateMsg').textContent='Код не подошёл. Проверь его и попробуй ещё раз.'; }
}
document.getElementById('gate').addEventListener('submit',e=>{ e.preventDefault(); document.getElementById('gateMsg').textContent='Проверяю…'; enter(document.getElementById('code').value); });
try{ const s=sessionStorage.getItem('tok-final-code'); if(s) enter(s,true); }catch(e){}
function boot(DATA){
const ALL = [...DATA.groups, ...DATA.cards].flatMap(g => g.items).concat(DATA.heroes.flatMap(h=>h.sections.flatMap(s=>s.folders.flatMap(f=>f.items))));
const BY = Object.fromEntries(ALL.map(x => [x.id, x]));
const root = document.getElementById('root');
let tab = 'sum', only = false, picks = new Set(), shown = [], cur = -1;
try{ picks = new Set(JSON.parse(localStorage.getItem('tok-final-picks')||'[]')); }catch(e){}
const $ = id => document.getElementById(id);
function say(t){ const s=$('status'); s.textContent=t||''; s.hidden=!t; }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function para(label, text){ const p=el('p','txt'); const b=el('b',null,label+' '); p.append(b, text); return p; }
function priceText(x){ if(x.p===null||x.p===undefined) return ''; return x.p===0 ? 'без затрат' : x.p+' кр'; }
const lazy=new IntersectionObserver(es=>es.forEach(async e=>{ if(!e.isIntersecting) return; lazy.unobserve(e.target); e.target.src=await blobUrl(e.target.dataset.src); }),{rootMargin:'500px'});

const hItems=h=>h.sections.flatMap(s=>s.folders.flatMap(f=>f.items));
function hCounts(h){ const a=hItems(h); return {all:a.length,keep:a.filter(x=>dec[x.id]==='keep').length,del:a.filter(x=>dec[x.id]==='del').length}; }
function decisionsText(){ const out=[]; for(const h of DATA.heroes){ const a=hItems(h); const k=a.filter(x=>dec[x.id]==='keep').map(x=>x.id), d=a.filter(x=>dec[x.id]==='del').map(x=>x.id); if(!k.length&&!d.length) continue; out.push(h.title+':'); if(k.length) out.push('ОСТАВИТЬ: '+k.join(', ')); if(d.length) out.push('УДАЛИТЬ: '+d.join(', ')); out.push(''); } return out.join('\n').trim(); }
function renderHero(key){

        for(const [v,t] of [['keep','Оставить'],['del','Удалить']]){
          const b=el('button','hb '+v,t); b.setAttribute('aria-pressed',dec[x.id]===v);
          b.onclick=()=>{ if(dec[x.id]===v) delete dec[x.id]; else dec[x.id]=v; saveDec(); it.classList.toggle('keep',dec[x.id]==='keep'); it.classList.toggle('del',dec[x.id]==='del'); acts.querySelectorAll('button').forEach(q=>q.setAttribute('aria-pressed',q.classList.contains(dec[x.id]||'-'))); const n=hCounts(h); line.textContent=`Всего ${n.all}. Оставить: ${n.keep}. Удалить: ${n.del}. Без решения: ${n.all-n.keep-n.del}. Здесь кнопки только отмечают выбор и файлы не удаляют. Картинки уменьшены до 900 пикселей.`; };
          acts.append(b);
        }
        it.append(acts); grid.append(it);
      }
      root.append(grid);
    }
  });
}
function renderSum(){
  for(const s of DATA.summary){
    root.append(el('h2',null,s.h));
    const l=el('div','sum');
    for(const [a,b] of s.items){ const p=el('p','sum-row'); p.append(el('b',null,a+' '), b); l.append(p); }
    root.append(l);
  }
}
function renderPrompts(){
  root.append(el('p','note pnote',DATA.prompts.note));
  for(const g of DATA.prompts.groups){
    root.append(el('h2',null,g.h));
    for(const x of g.items){
      const c=el('article','pcard');
      c.append(el('h3',null,x.t), el('p','pset',x.set));
      const w=el('dl','pwhere');
      for(const [a,b] of x.where){ w.append(el('dt',null,a), el('dd',null,b)); }
      c.append(w, el('pre','ptext',x.text));
      if(x.tip) c.append(el('p','note',x.tip));
      const acts=el('div','acts'), cp=el('button',null,'Скопировать промпт');
      cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(x.text); cp.textContent='Скопировано'; }catch(e){ cp.textContent='Выделите текст вручную'; } setTimeout(()=>cp.textContent='Скопировать промпт',1800); };
      acts.append(cp);
      if(x.res && BY[x.res]){ const idx=shown.length; shown.push(BY[x.res]); const b=el('button',null,'Смотреть результат'); b.onclick=()=>openLb(idx); acts.append(b); }
      c.append(acts); root.append(c);
    }
  }
}
function renderMat(){
  root.append(el('h2',null,'3D и материалы'));
  const l=el('div','mats');
  for(const x of DATA.materials){
    const c=el('article','pcard');
    c.append(el('h3',null,x.t), el('p','txt',x.d));
    const acts=el('div','acts');
    if(x.url){ const a=el('a','btn',"Открыть на Google Drive"); a.href=x.url; a.target='_blank'; a.rel='noopener'; acts.append(a); }
    else { const b=el('button',null,'Скачать'); b.onclick=()=>save(x); acts.append(b); }
    c.append(acts); l.append(c);
  }
  root.append(l);
}
function render(){
  root.textContent=''; shown=[];
  if(tab.startsWith('h:')){ renderHero(tab.slice(2)); return; } if(tab==='sum'){ renderSum(); return; } if(tab==='prompts'){ renderPrompts(); return; } if(tab==='mat'){ renderMat(); return; }
  const groups = tab==='gen' ? DATA.groups : DATA.cards;
  let any=false;
  for(const g of groups){
    const items = g.items.filter(x => !only || picks.has(x.id));
    if(!items.length) continue;
    any=true;
    root.append(el(tab==='gen'?'h2':'h3', null, g.title));
    if(g.note) root.append(el('p','note',g.note));
    const grid=el('div','grid');
    for(const x of items){
      const idx=shown.length; shown.push(x);
      const it=el('article','item'+(picks.has(x.id)?' on':''));
      const fr=el('button','frame'); fr.setAttribute('aria-label','Открыть: '+x.n); fr.onclick=()=>openLb(idx);
      const im=el('img'); im.alt=x.n; im.dataset.src=x.t; lazy.observe(im); fr.append(im);
      if(x.k==='v') fr.append(el('span','play','▶ видео'));
      it.append(fr, el('div','name',x.n));
      if(x.d) it.append(para('Что делал:', x.d));
      if(x.r) it.append(para('Итог:', x.r));
      const pr=priceText(x); if(pr) it.append(el('div','price',pr));
      const acts=el('div','acts');
      const star=el('button',null,picks.has(x.id)?'★ Отмечено':'☆ Отметить'); star.setAttribute('aria-pressed',picks.has(x.id)); star.onclick=()=>toggle(x.id);
      acts.append(star);
      const sv=el('button',null,'Скачать'); sv.onclick=()=>save(x); acts.append(sv);
      it.append(acts); grid.append(it);
    }
    root.append(grid);
  }
  if(!any) root.append(el('p','note', only ? 'Здесь пока нет отмеченных. Нажми звезду под понравившимся кадром.' : 'Пусто.'));
  $('count').textContent='Отмечено: '+picks.size;
}
function toggle(id){
  const on=!picks.has(id);
  if(on) picks.add(id); else picks.delete(id);
  render(); syncLb();
  try{ localStorage.setItem('tok-final-picks', JSON.stringify([...picks])); }catch(e){}
}
async function save(x){
  say('Готовлю файл: '+x.dl);
  try{ const a=document.createElement('a'); a.href=await blobUrl(x.f); a.download=x.dl; document.body.append(a); a.click(); a.remove(); say(''); }
  catch(e){ say('Файл не скачался. Попробуй ещё раз.'); }
}
function syncLb(){
  if(cur<0||!shown[cur]) return;
  const x=shown[cur], on=picks.has(x.id);
  $('lbPick').textContent=on?'★ Отмечено':'☆ Отметить'; $('lbPick').setAttribute('aria-pressed',on);
}
async function openLb(i){
  cur=i; const x=shown[i], v=$('lbView'), tok=++lbTok; v.textContent='Загружаю…'; v.classList.remove('zoom');
  blobUrl(x.f).then(u=>{ if(tok!==lbTok) return; v.textContent='';
    if(x.k==='v'){ const m=el('video'); m.src=u; m.controls=true; m.autoplay=true; m.muted=true; m.loop=true; m.playsInline=true; v.append(m); }
    else{ const m=el('img'); m.src=u; m.alt=x.n; m.onclick=()=>v.classList.toggle('zoom'); v.append(m); }
  }).catch(()=>{ if(tok===lbTok) v.textContent='Файл не загрузился. Закрой и открой снова.'; });
  const t=$('lbText'); t.textContent=''; t.append(el('div','name',x.n));
  if(x.d) t.append(para('Что делал:',x.d)); if(x.r) t.append(para('Итог:',x.r));
  $('lb').hidden=false; syncLb(); $('lbClose').focus();
}
function closeLb(){ lbTok++; $('lb').hidden=true; $('lbView').textContent=''; cur=-1; }
function step(d){ if(cur<0) return; openLb((cur+d+shown.length)%shown.length); }
$('lbClose').onclick=closeLb; $('lbPrev').onclick=()=>step(-1); $('lbNext').onclick=()=>step(1);
$('lbPick').onclick=()=>toggle(shown[cur].id); $('lbSave').onclick=()=>{ const x=shown[cur]; closeLb(); save(x); };
addEventListener('keydown',e=>{ if($('lb').hidden) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
const TABS={sum:'tabSum',prompts:'tabPrompts',gen:'tabGen',cards:'tabCards',mat:'tabMat'};
const hbar=el('div','hbar'); hbar.append(el('span','hlab','Выбор по героям:')); for(const h of DATA.heroes){ const b=el('button',null,h.title+' · '+h.count); b.id='tabH'+h.key; TABS['h:'+h.key]=b.id; hbar.append(b); } document.querySelector('.bar').after(hbar);
function markTabs(){ for(const k in TABS) $(TABS[k]).setAttribute('aria-pressed',tab===k); }
function setTab(t){ tab=t; if(location.hash==='#geroi') tab='h:'+DATA.heroes[0].key;
markTabs(); render(); scrollTo(0,0); }
for(const k in TABS) $(TABS[k]).onclick=()=>setTab(k);
$('onlyPicked').onclick=()=>{ only=!only; $('onlyPicked').setAttribute('aria-pressed',only); render(); };
if(location.hash==='#karty') tab='cards';
markTabs();
render();
$('copyPicks').onclick=async()=>{
  const t=ALL.filter(x=>picks.has(x.id)).map(x=>x.id+' '+x.n).join('\n');
  if(!t){ say('Сначала отметь кадры звездой.'); return; }
  try{ await navigator.clipboard.writeText(t); say('Список скопирован, можно вставить в сообщение.'); }
  catch(e){ say(t); }
};

}
</script>
</body></html>
