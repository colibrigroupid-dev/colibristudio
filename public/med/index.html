<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D0A07">
<title>Медовая платформа</title>
<style>
:root{--fon:#0D0A07;--tekst:#F2E8D2;--zoloto:#D9AE4A;--plashka:#221A11;--oshibka:#FF9C7A;--vys:52px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fon);color:var(--tekst);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px}
[hidden]{display:none!important}
.zamok{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px))}
.zamok h1{margin:0;font-size:32px;line-height:1.1;color:var(--zoloto)}
.zamok p{margin:0;color:#B9A888}
label{font-size:15px}
input{width:100%;min-height:52px;padding:12px 14px;font:inherit;background:var(--plashka);color:var(--tekst);border:1px solid #6B5840;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
input:focus{outline:3px solid var(--zoloto);outline-offset:1px}
.zamok button{min-height:52px;font:inherit;font-weight:700;background:var(--zoloto);color:var(--fon);border:0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6}
.oshibka{color:var(--oshibka)!important;min-height:1.4em}
.vkladki{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;background:var(--fon);border-bottom:2px solid var(--zoloto);
  padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));padding-top:max(6px,env(safe-area-inset-top,0px))}
.vkladki::-webkit-scrollbar{display:none}
.vkladki button{flex:0 0 auto;min-height:40px;padding:0 14px;font:inherit;font-size:15px;font-weight:600;background:var(--plashka);color:var(--tekst);border:0;border-radius:4px;cursor:pointer;white-space:nowrap}
.vkladki button[aria-pressed=true]{background:var(--zoloto);color:var(--fon)}
.vkladki button:focus-visible{outline:2px solid var(--tekst);outline-offset:1px}
.vkladki #vyjti{margin-left:auto;background:transparent;color:#B9A888}
.panel{position:fixed;top:calc(var(--vys) + env(safe-area-inset-top,0px));left:0;right:0;bottom:0;background:#FBF4E2}
.panel iframe{display:block;width:100%;height:100%;border:0}
.zagruzka{position:fixed;top:calc(var(--vys) + env(safe-area-inset-top,0px));left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center;background:var(--fon);z-index:40}
.zagruzka button{min-height:44px;padding:0 18px;font:inherit;font-weight:700;background:var(--zoloto);color:var(--fon);border:0;border-radius:4px;cursor:pointer}
body.otkryto{overflow:hidden}
</style>
</head>
<body>
<form class="zamok" id="forma" autocomplete="off">
  <h1>Медовая платформа</h1>
  <p>Закрытые материалы команды.</p>
  <label for="kod">Введите код доступа</label>
  <input id="kod" name="kod" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
  <button type="submit" id="vojti">Открыть</button>
  <p class="oshibka" id="oshibka" role="alert"></p>
</form>
<div id="tablo" hidden>
  <nav class="vkladki" aria-label="Разделы">
    <button type="button" data-p="obzor">Обзор</button>
    <button type="button" data-p="karta">Карта</button>
    <button type="button" data-p="otchet">Жантак</button>
    <button type="button" data-p="prototip">Сайт</button>
    <button type="button" data-p="reklama">Реклама</button>
    <button type="button" data-p="roliki">Ролики</button>
    <button type="button" data-p="etiketka">Этикетка</button>
    <button type="button" data-p="dogovor">Договор</button>
    <button type="button" data-p="dengi">Деньги</button>
    <button type="button" data-p="buhgalteriya">Бухгалтерия</button>
    <button type="button" data-p="polka">Полки</button>
    <button type="button" id="vyjti">Выйти</button>
  </nav>
  <div id="paneli"></div>
  <div class="zagruzka" id="zagruzka" hidden role="status"><span id="z-tekst">Загружаем…</span><button type="button" id="z-povtor" hidden>Повторить</button></div>
</div>
<script>
(function(){
  var RAZDELY=["obzor","karta","otchet","prototip","reklama","roliki","etiketka","dogovor","dengi","buhgalteriya","polka"];
  var NAZV={obzor:"Обзор",karta:"Карта",otchet:"Жантак",prototip:"Сайт",reklama:"Реклама",roliki:"Ролики",etiketka:"Этикетка",dogovor:"Договор",dengi:"Деньги",buhgalteriya:"Бухгалтерия",polka:"Полки"};
  var forma=document.getElementById('forma'),oshibka=document.getElementById('oshibka'),vojti=document.getElementById('vojti'),pole=document.getElementById('kod');
  var kluch=null,faily=null,versiya=0,kodV='',gotovo={},est={},tekushchij=null,ochered=0;
  function $(id){return document.getElementById(id)}
  function iz64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function chitat(){try{return localStorage.getItem('med_kod')||''}catch(e){return ''}}
  function pisat(k){try{localStorage.setItem('med_kod',k)}catch(e){}}
  function zabyt(){try{localStorage.removeItem('med_kod')}catch(e){}}
  async function poluchit(put,tip,vremya){
    var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},vremya||60000);
    try{var r=await fetch(put,{cache:tip==='json'?'no-store':'default',signal:ctl.signal});if(!r.ok)throw new Error('zagruzka');return await r[tip]()}
    finally{clearTimeout(t)}
  }
  async function rasshifrovat(imya){
    var z=faily[imya];if(!z)throw new Error('net razdela');
    var shifr=await poluchit(z.f+'?v='+versiya,'arrayBuffer',120000);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iz64(z.iv)},kluch,shifr);
  }
  // Если материалы перевыложили, пока страница открыта, заново читаем список разделов и пробуем ещё раз
  async function sPovtorom(fn){
    try{return await fn()}
    catch(err){if(!kodV)throw err;await otkryt(kodV);return fn()}
  }
  async function tekst(imya){return new TextDecoder().decode(await rasshifrovat(imya))}

  function panel(imya){
    var p=$('p-'+imya);
    if(!p){p=document.createElement('div');p.className='panel';p.id='p-'+imya;p.hidden=true;
      var f=document.createElement('iframe');f.title=NAZV[imya];p.appendChild(f);$('paneli').appendChild(p)}
    return p;
  }
  async function zagruzit(imya){
    var f=panel(imya).querySelector('iframe');
    if(imya==='roliki'){
      var d,bajty;
      await sPovtorom(async function(){
        d=JSON.parse(await tekst('roliki.json'));
        var imena=Object.keys(faily).filter(function(k){return /^list-\d+\.jpg$/.test(k)});
        bajty=await Promise.all(imena.map(async function(k){return [k,await rasshifrovat(k)]}));
      });
      var listy={};bajty.forEach(function(x){listy[x[0]]=URL.createObjectURL(new Blob([x[1]],{type:'image/jpeg'}))});
      window.MED_CRM={dannye:d.dannye,listy:listy};
      f.srcdoc=d.shablon;
    }else{
      f.srcdoc=await sPovtorom(function(){return tekst(imya+'.html')});
    }
  }
  async function pokazat(imya){
    if(RAZDELY.indexOf(imya)<0)imya='obzor';
    tekushchij=imya;var moya=++ochered;
    document.querySelectorAll('.vkladki [data-p]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===imya?'true':'false');if(b.dataset.p===imya)b.scrollIntoView({block:'nearest',inline:'nearest'})});
    document.querySelectorAll('.panel').forEach(function(p){p.hidden=p.id!=='p-'+imya});
    try{history.replaceState(null,'','#'+imya)}catch(e){}
    if(est[imya]){$('zagruzka').hidden=true;return}
    panel(imya).hidden=true;
    $('z-tekst').textContent=imya==='roliki'?'Загружаем ролики и обложки, около 7 МБ…':'Загружаем раздел «'+NAZV[imya]+'»…';
    $('z-povtor').hidden=true;$('zagruzka').hidden=false;
    try{
      if(!gotovo[imya]){gotovo[imya]=zagruzit(imya)}
      await gotovo[imya];est[imya]=true;
      if(moya===ochered){$('zagruzka').hidden=true;panel(imya).hidden=false}
    }catch(err){
      delete gotovo[imya];
      if(moya===ochered){$('z-tekst').textContent='Не удалось загрузить раздел. Проверьте соединение.';$('z-povtor').hidden=false}
    }
  }
  async function otkryt(kod){
    var par=await poluchit('parametry.json','json');
    var baza=await crypto.subtle.importKey('raw',new TextEncoder().encode(kod),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:iz64(par.sol),iterations:par.iter,hash:'SHA-256'},baza,{name:'AES-GCM',length:256},false,['decrypt']);
    var sp=await crypto.subtle.decrypt({name:'AES-GCM',iv:iz64(par.iv)},k,iz64(par.spisok));
    faily=JSON.parse(new TextDecoder().decode(sp));kluch=k;versiya=par.v||0;
  }
  async function vhod(kod){
    if(!window.isSecureContext||!window.crypto||!crypto.subtle){oshibka.textContent='Этот браузер не умеет открывать материалы. Откройте ссылку в Chrome или Safari.';return}
    oshibka.textContent='';vojti.disabled=true;vojti.textContent='Открываем…';
    try{
      await otkryt(kod);pisat(kod);kodV=kod;
      forma.hidden=true;$('tablo').hidden=false;document.body.classList.add('otkryto');
      pokazat((location.hash||'').slice(1)||'obzor');
    }catch(err){
      if(err&&err.name==='OperationError'){zabyt();pole.value='';oshibka.textContent='Код не подошёл. Проверьте и введите ещё раз.'}
      else{pole.value=kod;oshibka.textContent='Не удалось загрузить материалы. Проверьте соединение и повторите.'}
    }
    finally{vojti.disabled=false;vojti.textContent='Открыть'}
  }
  document.querySelector('.vkladki').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(b)pokazat(b.dataset.p)});
  $('z-povtor').addEventListener('click',function(){if(tekushchij)pokazat(tekushchij)});
  window.addEventListener('message',function(e){
    var svoj=Array.prototype.some.call(document.querySelectorAll('.panel iframe'),function(f){return f.contentWindow===e.source});
    if(svoj&&e.data&&typeof e.data.razdel==='string')pokazat(e.data.razdel);
  });
  forma.addEventListener('submit',function(e){e.preventDefault();vhod(pole.value.trim().toUpperCase())});
  $('vyjti').addEventListener('click',function(){
    zabyt();kodV='';kluch=null;faily=null;pole.value='';
    $('paneli').innerHTML='';
    if(window.MED_CRM){Object.keys(window.MED_CRM.listy||{}).forEach(function(k){URL.revokeObjectURL(window.MED_CRM.listy[k])});delete window.MED_CRM}
    location.replace(location.pathname)});
  // Возврат кнопкой «Назад» после выхода не должен показывать материалы из памяти браузера
  window.addEventListener('pageshow',function(e){if(e.persisted&&!chitat())location.reload()});
  var s=chitat();if(s)vhod(s);
})();
</script>
</body>
</html>
