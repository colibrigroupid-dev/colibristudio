<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ОРДА — купе, 3D-схема</title><style>
:root{--bg:#14110d;--panel:#1e1914;--ink:#f2ebdf;--mute:#c4b6a3;--line:#3a3129;--gold:#c8952e;--red:#c2362b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#wrap{display:grid;grid-template-columns:1fr 360px;grid-template-rows:1fr auto;height:100%}
#view{position:relative;min-width:0;min-height:0;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:14px;top:12px;right:14px;pointer-events:none;display:flex;justify-content:space-between;gap:12px;text-shadow:0 1px 3px #000}
#hud b{font-size:17px}#hud span{color:var(--mute)}
#sub{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;max-width:min(92%,900px);text-align:center;font-size:17px;line-height:1.35;color:#fff;text-shadow:0 0 4px #000,0 1px 2px #000;pointer-events:none}
#sub i{font-style:normal;color:var(--gold);font-size:13px;letter-spacing:.06em;display:block}
#side{grid-row:1/3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 12px 40px}
#side h1{font-size:16px;margin:0 0 4px}#side p{margin:0 0 10px;color:var(--mute);font-size:12.5px}
#side h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.shot{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:5px 0;cursor:pointer}
.shot.on{border-color:var(--gold);background:#2a2219}.shot b{color:var(--gold)}.shot small{color:var(--mute);display:block;font-size:12px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--mute);vertical-align:1px}.tag.g{color:#9fb6d9;border-color:#3d4a5c}
.sc{margin:14px 0 4px;font-weight:700;font-size:13px}
#bar{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);background:var(--panel)}
button{background:#2a2219;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:#6b5a45}button.on{border-color:var(--gold);color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]{accent-color:var(--gold)}#tl{flex:1;min-width:160px}
#tm{font-variant-numeric:tabular-nums;min-width:96px;text-align:right;color:var(--mute)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 6px;font-size:12.5px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#my{position:absolute;right:12px;top:58px;width:250px;background:rgba(20,17,13,.88);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:none}
#my label{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px}#my input{width:100%}
#my .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}#my small{color:var(--mute);display:block;margin-top:6px;font-size:11.5px;line-height:1.4}
.saved{display:flex;justify-content:space-between;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;font-size:12.5px}
.saved button{padding:2px 8px;font-size:12px}
.setup{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}.setup b{color:var(--gold)}.setup small{color:var(--mute)}
#hint{position:absolute;left:14px;bottom:12px;color:var(--mute);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
@media (max-width:860px){#wrap{grid-template-columns:1fr;grid-template-rows:56vh auto 1fr}#view{grid-row:1}#bar{grid-row:2;grid-column:1}#side{grid-row:3;grid-column:1;border-left:0;border-top:1px solid var(--line)}#my{top:auto;bottom:10px;right:10px;width:220px}#sub{font-size:14px;bottom:10px}#hud b{font-size:15px}}

#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}#gate form{text-align:center;max-width:320px;padding:16px}
#gate input{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;letter-spacing:.12em;width:100%;margin:12px 0}#gerr{color:#e08a7a;min-height:1.4em}</style></head>
<body><div id="gate"><form id="gf"><h1 style="font-size:20px;margin:0">ОРДА · купе, сцены 6–7</h1><p style="color:var(--mute);margin:6px 0 0">3D-схема купе: герои, кадры, камеры. Введите код доступа.</p>
<input id="gc" placeholder="КОД" autocomplete="off" autofocus><button>Открыть</button><p id="gerr"></p><p style="color:var(--mute);font-size:12px">Конфиденциально</p></form></div>
