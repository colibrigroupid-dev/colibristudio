<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ОРДА — бой в юрте, 3D-схема</title><style>
:root{--bg:#14110d;--panel:#1e1914;--ink:#f2ebdf;--mute:#c4b6a3;--line:#3a3129;--gold:#c8952e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#wrap{display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr auto;height:100%}
#view{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:14px;top:12px;right:14px;pointer-events:none;display:flex;justify-content:space-between;gap:12px}
#hud b{font-size:18px}#hud span{color:var(--mute)}
#cap{position:absolute;left:14px;bottom:12px;right:14px;background:rgba(20,17,13,.78);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
#cap b{color:var(--gold)}#cap{display:flex;gap:12px;align-items:center}#cimg{width:230px;border-radius:8px;display:none;cursor:zoom-in}#cimg.big{position:fixed;left:2vw;top:2vh;width:min(96vw,1400px);z-index:5;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.8)}.shot i{float:right;font-style:normal;color:var(--gold);font-size:11px}
#side{grid-row:1/3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px}
#side h1{font-size:16px;margin:0 0 4px}#side p{margin:0 0 10px;color:var(--mute);font-size:12.5px}
.shot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.shot.on{border-color:var(--gold);background:#2a2219}.shot b{color:var(--gold)}.shot small{color:var(--mute);display:block}
#bar{grid-column:1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
button{background:#2a2219;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
button.on{border-color:var(--gold);color:var(--gold)}input[type=range]{flex:1;accent-color:var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:8px 0 12px;font-size:12.5px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:right;color:var(--mute)}

#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}#gate form{text-align:center;max-width:320px;padding:16px}
#gate input{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;letter-spacing:.12em;width:100%;margin:12px 0}#gerr{color:#e08a7a;min-height:1.4em}</style></head>
<body><div id="gate"><form id="gf"><h1 style="font-size:20px;margin:0">ОРДА · бой в юрте</h1><p style="color:var(--mute);margin:6px 0 0">3D-схема сцены. Введите код доступа.</p>
<input id="gc" placeholder="КОД" autocomplete="off" autofocus><button>Открыть</button><p id="gerr"></p><p style="color:var(--mute);font-size:12px">Конфиденциально</p></form></div>
