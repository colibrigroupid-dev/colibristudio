<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ОРДА — съёмки</title>
<meta name="description" content="Закрытая рабочая страница. Вход по коду.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1ECE2;--paper:#FBF8F2;--ink:#17130F;--muted:#5A5048;--line:#D8CFC0;
  --red:#A3241C;--red2:#7E1A14;--gold:#C8952E;--steppe:#CBBE97;--sky1:#F3D9A8;--sky2:#E7B77A;
  --night:#1B1611;--night-ink:#F4EDE2;--night-muted:#C9BBA8;--fillbg:#FFF4C9;
  --display:"Unbounded",system-ui,"Segoe UI",sans-serif;
  --body:"Onest","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14110D;--paper:#1E1914;--ink:#F2EBDF;--muted:#C4B6A3;--line:#3A3129;--steppe:#4A4232;--sky1:#3A2A1C;--sky2:#5A3A22;--fillbg:#3A3212;
}}
:root[data-theme="dark"]{--ground:#14110D;--paper:#1E1914;--ink:#F2EBDF;--muted:#C4B6A3;--line:#3A3129;--steppe:#4A4232;--sky1:#3A2A1C;--sky2:#5A3A22;--fillbg:#3A3212;}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:var(--body);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.proto{background:var(--ink);color:var(--ground);font-size:13px;text-align:center;padding:9px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-1px;text-decoration:none}
.logo i,h1 i,.big-logo i{font-style:normal;color:var(--red)}
nav{display:flex;gap:22px;font-weight:500;font-size:15px}
nav a{text-decoration:none}nav a:hover{text-decoration:underline;text-underline-offset:5px}
.mnav{display:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(12px,3vw,40px) 0 clamp(48px,6vw,96px)}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,5.2vw,78px);line-height:1;letter-spacing:-.045em;margin:0 0 24px}
.lead{font-size:clamp(17px,1.5vw,21px);color:var(--muted);max-width:32em;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:18px 36px;margin-top:34px;padding-top:22px;border-top:1.5px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.1;margin-bottom:4px}
.stats span{font-size:14px;color:var(--muted)}
.poster svg{width:100%;height:auto;display:block}
.svgt{font-family:var(--body);font-size:15px;fill:var(--ink);opacity:.75}
.draw{animation:rise 1.2s ease-out both}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.draw{animation:none}}
.ticker{background:var(--night);color:var(--night-muted);border-top:3px solid var(--red)}
.ticker div{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 30px;padding:18px 20px;font-family:var(--display);font-size:clamp(14px,1.8vw,22px)}
section{padding:clamp(64px,8vw,120px) 0}
section.alt{background:var(--paper)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,54px);line-height:1.04;letter-spacing:-.04em;margin:0 0 18px}
.h3s{font-family:var(--display);font-weight:600;font-size:clamp(20px,2vw,26px);letter-spacing:-.02em;margin:56px 0 16px}
.sub{color:var(--muted);max-width:44em;margin:0 0 8px}
.small{font-size:14px;color:var(--muted)}
.pillars{margin-top:44px;border-top:1.5px solid var(--ink)}
.pillar{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) minmax(0,.9fr);gap:28px;padding:32px 0;border-bottom:1.5px solid var(--line);align-items:start}
.pillar h3{font-family:var(--display);font-weight:800;font-size:clamp(32px,4vw,58px);letter-spacing:-.05em;line-height:.9;margin:0}
.pillar p{margin:0;color:var(--muted)}
.pillar ul{margin:0;padding:0;list-style:none;font-size:15px;font-weight:500}
.pillar li{padding:6px 0;border-bottom:1px dashed var(--line)}
.pillar.new h3{color:var(--red)}
.tbl-wrap{overflow-x:auto;margin-top:28px;border:1.5px solid var(--line);border-radius:22px;background:var(--paper)}
section.alt .tbl-wrap{background:var(--ground)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
.tbl th{text-align:left;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 16px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.num td:nth-child(n+3){white-space:nowrap}
.tbl tr.sum td{font-weight:700;background:rgba(163,36,28,.07)}
.tbl.budg td:nth-child(n+3),.tbl.budg th:nth-child(n+3){white-space:nowrap}
.tbl.budg td:nth-child(n+4),.tbl.budg th:nth-child(n+4){text-align:right}
.tbl.budg tr:not(.sub):not(.sum):not(.grp) td:nth-child(2){min-width:300px;white-space:normal}
.tbl.budg tr:not(.sub):not(.sum):not(.grp) td:first-child{min-width:170px}
.tbl.budg td:last-child{white-space:nowrap;width:1%}
.tbl.budg td small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.tbl.budg tr.sub td,.tbl.budg tr.sum td{text-align:right}
.tbl.sums td:nth-child(2),.tbl.sums th:nth-child(2){white-space:nowrap;text-align:right}
.tbl.sums td:first-child{min-width:220px}
.tbl td.fill{background:var(--fillbg);min-width:110px}
.risk{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.risk.hi{background:var(--red);color:#fff}.risk.mid{background:var(--gold);color:#1b140c}.risk.lo{background:var(--steppe);color:#1b140c}
.ladder{margin-top:40px;border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:70px minmax(0,1.6fr) 130px minmax(0,1fr);gap:20px;align-items:start;padding:22px 0;border-bottom:1.5px solid var(--line)}
.row .num{font-family:var(--display);font-weight:700;font-size:26px;color:var(--red);letter-spacing:-.03em}
.row h3{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:clamp(18px,1.8vw,23px);letter-spacing:-.02em}
.row p{margin:0;color:var(--muted);font-size:15px}
.row .meta{font-weight:600;color:var(--ink)}
.row.hot{background:var(--paper);border-radius:22px;border-bottom-color:transparent;padding-left:14px;padding-right:14px;margin:8px -14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:28px;padding:clamp(22px,3vw,38px)}
section.alt .card{background:var(--ground)}
.card.wide{margin-top:20px}
.card h3{font-family:var(--display);font-weight:600;font-size:clamp(19px,1.9vw,25px);letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
.card p{margin:0 0 12px;color:var(--muted)}
.card p:last-child{margin-bottom:0}
.rules{margin:10px 0 0;padding:0 0 0 20px;color:var(--muted);font-size:16px}
.rules li{margin:7px 0}
.facts{list-style:none;margin:6px 0 0;padding:0;border-top:1.5px solid var(--ink)}
.facts li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1.5px solid var(--line);font-size:15px}
.facts b{font-family:var(--display);font-weight:500;font-size:14px;color:var(--red)}
.note{margin-top:28px;border-left:4px solid var(--gold);background:var(--paper);border-radius:0 22px 22px 0;padding:20px 24px;font-size:16px}
.night{background:var(--night);color:var(--night-ink)}
.night .sub,.night .eyebrow{color:var(--night-muted)}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:40px 0 28px}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:8px 0 34px}
.tm{border:1.5px solid var(--line);border-radius:22px;padding:14px;background:var(--paper)}
.tm img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin-bottom:14px}
.tm .n{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.15}
.tm .r{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin:6px 0 10px;min-height:32px}
.tm p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.tm p.in{margin-top:10px;color:var(--ink)}
@media(max-width:980px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.team{grid-template-columns:1fr}}
.day{border:1.5px solid rgba(244,237,226,.25);border-radius:26px;padding:26px}
.day b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.03em;color:var(--gold);line-height:1;margin-bottom:14px}
.day h3{margin:0 0 8px;font-size:18px;font-weight:600}
.day p{margin:0;color:var(--night-muted);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:36px}
.plan{background:var(--paper);border:1.5px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:8px}
.plan.best{border:2px solid var(--red)}
.plan h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px}
.plan .price{font-family:var(--display);font-weight:700;font-size:clamp(28px,3vw,40px);letter-spacing:-.03em;color:var(--red);margin:4px 0}
.plan .price small{display:block;font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:4px}
.plan p{margin:0;color:var(--muted);font-size:15px}
.plan ul{margin:8px 0 0;padding:0;list-style:none;font-size:15px}
.plan li{padding:6px 0;border-top:1px dashed var(--line)}
.tag{align-self:flex-start;font-size:12px;font-weight:600;background:var(--red);color:#fff;border-radius:999px;padding:4px 12px}
.accent{background:var(--red2);color:#F7ECE6}
.accent .sub,.accent .eyebrow{color:#E8CFC7}
.card.dark{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.18);color:#F7ECE6}
.card.dark p,.card.dark .rules{color:#F0DDD6}
.card.dark a{color:#FFD58A}
.for-rina{margin-top:28px;border:1.5px dashed var(--red);border-radius:28px;padding:clamp(22px,3vw,38px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.for-rina p{margin:0 0 10px;color:var(--muted)}
.log{margin-top:40px;border-top:1.5px solid var(--line);padding-top:20px;font-size:15px;color:var(--muted)}
.log h3{font-family:var(--display);font-weight:500;font-size:18px;color:var(--ink);margin:0 0 8px}
footer{background:var(--night);color:var(--night-ink);padding:clamp(48px,6vw,88px) 0 36px}
.fgrid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px}
.big-logo{font-family:var(--display);font-weight:800;font-size:clamp(64px,13vw,190px);letter-spacing:-.06em;line-height:.85}
.flinks{display:grid;gap:8px;font-size:15px;color:var(--night-muted)}
.legal{margin-top:40px;font-size:13px;opacity:.7}
.card.ok{border-top:6px solid #6E8B4E}
.card.no{border-top:6px solid var(--red)}
.card.ok h3{color:#557040}.card.no h3{color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.ok h3{color:#A9C48A}:root:not([data-theme="light"]) .card.no h3{color:#E36A5E}}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 16px}
.compare div{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:22px 24px}
.compare div:nth-child(2){border-color:var(--gold)}
.compare b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(26px,2.8vw,38px);letter-spacing:-.03em;line-height:1.05;margin-bottom:6px}
.compare div:nth-child(2) b{color:var(--gold)}
.compare span{font-size:15px;color:var(--muted)}
.calc td{vertical-align:middle}
.calc td small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.calc td.c{white-space:nowrap;text-align:right}
.calc td.c small.t{font-weight:600;color:var(--ink)}
.calc th:nth-child(n+3){text-align:right}
.calc tr.grp td{font-family:var(--display);font-weight:600;font-size:15px;background:rgba(200,149,46,.10);padding-top:16px}
.calc tr.sub td{font-weight:600;color:var(--muted)}
.calc tr.total td{font-weight:700;font-size:17px;background:rgba(163,36,28,.07)}
.calc .tc{background:var(--fillbg)}
.calc input{width:96px;font:inherit;font-size:15px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:right}
.calc input.sh{width:64px}
.calc input.fx{width:90px;margin-left:6px}
.calc input:focus{outline:none;border-color:var(--gold)}
.calc .u{font-size:13px;color:var(--muted);margin-left:6px}
.calc td.mid{text-align:center;font-weight:600}
.calc .neg{color:#C0392B}.calc .pos{color:#4E7A34}
#calcsum td:nth-child(n+2){text-align:right;white-space:nowrap}
.calcbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:8px}
.gal figure{margin:0;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
section.alt .gal figure{background:var(--ground)}
.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.gal figcaption{padding:12px 16px 14px;font-size:14px;color:var(--muted);line-height:1.4}
.gal figcaption b{color:var(--ink)}
.shots details{border:1.5px solid var(--line);border-radius:18px;margin:10px 0;background:var(--paper)}
.shots summary{cursor:pointer;padding:14px 18px;font-size:16px;list-style:none}
.shots summary::-webkit-details-marker{display:none}
.shots summary::before{content:"+";display:inline-block;width:22px;color:var(--red);font-family:var(--display);font-weight:700}
.shots details[open] summary::before{content:"–"}
.shots .tbl-wrap{margin:0 12px 12px;border:0}
.tbl.shot td:nth-child(1),.tbl.shot td:nth-child(5){white-space:nowrap;color:var(--muted)}
.sp{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
.sp.s{background:#6E8B4E;color:#fff}.sp.sg{background:#8B9A6E;color:#fff}.sp.g{background:var(--gold);color:#1b140c}.sp.k{background:#777;color:#fff}
/* side menu */
.side{position:fixed;left:0;top:0;bottom:0;width:232px;padding:26px 18px 20px 22px;background:var(--paper);border-right:1.5px solid var(--line);display:flex;flex-direction:column;gap:18px;z-index:60;overflow-y:auto}
.side .logo{font-size:26px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.snav a i{font-style:normal;font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--gold);width:22px}
.snav a:hover{background:var(--ground);color:var(--ink)}
.snav a.on{background:var(--ink);color:var(--ground)}
.snav a.on i{color:var(--gold)}
.sfoot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5}
#app{padding-left:232px}
#app .wrap{max-width:1180px}
.mbar,.mback{display:none}
.vid{margin-top:28px;border-radius:22px;overflow:hidden;background:#000;border:1.5px solid var(--line)}
.vid video{display:block;width:100%;aspect-ratio:16/9}
@media (max-width:1100px){
  #app{padding-left:0;padding-top:58px}
  .mbar{display:flex;position:fixed;top:0;left:0;right:0;height:58px;align-items:center;gap:12px;padding:0 16px;background:var(--paper);border-bottom:1.5px solid var(--line);z-index:70}
  .mbar .logo{font-size:22px}
  .mcur{flex:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbtn{background:var(--ink);color:var(--ground);border:0;border-radius:999px;padding:9px 16px;font:600 14px var(--body);cursor:pointer}
  .side{transform:translateX(-100%);transition:transform .22s ease;width:min(300px,84vw);top:58px;box-shadow:none}
  body.menu-open .side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.25)}
  body.menu-open .mback{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:55}
  .snav a{font-size:17px;padding:11px 12px}
  .proto{display:none}
}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--night)}
.gate .box{background:#231C15;border:1px solid #3A3129;border-radius:28px;padding:40px 34px;max-width:420px;width:100%;text-align:center;color:var(--night-ink)}
.gate .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0}
.gate h3{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.03em;margin:8px 0 6px}
.gate h3 i{font-style:normal;color:#E0493D}
.gate p{color:var(--night-muted);font-size:15px;margin:0 0 20px}
.gate input{width:100%;background:#14110D;border:1px solid #3A3129;border-radius:14px;color:var(--night-ink);font-size:18px;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:14px 12px;outline:none;font-family:var(--body)}
.gate input:focus{border-color:var(--gold)}
.gate button{margin-top:12px;width:100%}
.gate .err{color:#E0705F;font-size:14px;margin-top:12px;min-height:20px}
@media (max-width:980px){
  nav,header .btn{display:none}
  .mnav{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav a{flex-shrink:0;white-space:nowrap;padding:9px 15px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:none;font-size:14px;font-weight:500}
  .hero,.two,.for-rina{grid-template-columns:1fr}
  .poster{max-width:420px;width:100%;margin:0 auto}
  .pillar{grid-template-columns:1fr;gap:12px}
  .grid3,.plans,.compare,.gal{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:52px 1fr;gap:6px 14px}
  .row .meta,.row .how{grid-column:2}
}
@media (max-width:560px){
  body{font-size:17px}
  .days{grid-template-columns:1fr}
  .facts li{grid-template-columns:1fr;gap:4px}
}
</style>
<style>
.top{padding:72px 0 8px}.top h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.1;margin:10px 0 14px}

<script>
(function(){
  var P=JSON.parse(document.getElementById("payload").textContent);
  var MAIN="https://colibristudio.ai/orda/", MAIL="alex@neyra.ai";
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function norm(v){return (v||"").replace(/\s+/g,"").toUpperCase()}
  async function open(code){
    var te=new TextEncoder();
    var km=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
    document.getElementById("app").innerHTML=new TextDecoder().decode(pt);
    document.getElementById("gate").remove();
    initCalc();
  }
  function initCalc(){
    var T=document.getElementById("calc"), KEY="orda_calc_taurus_v1", rows=[].slice.call(T.querySelectorAll("tr.ci"));
    var fmt=function(n){return Math.round(n).toLocaleString("ru-RU")};
    var num=function(el){var v=parseFloat((el.value||"").replace(",","."));return isNaN(v)?null:v};
    var note=document.getElementById("calcNote");
    function state(){var st={sh:{},t:{},fx:num(document.getElementById("fx")),note:note.value||""};
      rows.forEach(function(r){var id=r.dataset.id;st.sh[id]=num(r.querySelector(".sh"));var tv=num(r.querySelector(".tr"));if(tv!==null)st.t[id]=tv});return st}
    function apply(st){if(!st)return;rows.forEach(function(r){var id=r.dataset.id;
        if(st.sh&&typeof st.sh[id]==="number")r.querySelector(".sh").value=st.sh[id];
        if(st.t&&typeof st.t[id]==="number")r.querySelector(".tr").value=st.t[id]});
      if(typeof st.fx==="number")document.getElementById("fx").value=st.fx; if(typeof st.note==="string")note.value=st.note}
    function calc(){
      var tot={e:0,m:0,t:0},grp={};
      rows.forEach(function(r){var q=num(r.querySelector(".sh"))||0,g=r.dataset.g;grp[g]=grp[g]||{e:0,m:0,t:0};
        var rate={e:+r.dataset.e,m:+r.dataset.m},tv=num(r.querySelector(".tr"));rate.t=tv===null?rate.m:tv;
        ["e","m","t"].forEach(function(c){var v=q*rate[c];grp[g][c]+=v;tot[c]+=v;r.querySelector('small.t[data-c="'+c+'"]').textContent="= "+fmt(v)})});
      Object.keys(grp).forEach(function(g){var tr=T.querySelector('tr.sub[data-sub="'+g+'"]');["e","m","t"].forEach(function(c){tr.querySelector('[data-c="'+c+'"]').textContent=fmt(grp[g][c])})});
      var fx=num(document.getElementById("fx"))||439;
      ["e","m","t"].forEach(function(c){var res=tot[c]*0.1,all=tot[c]+res;
        T.querySelector('[data-res="'+c+'"]').textContent=fmt(res);T.querySelector('[data-tot="'+c+'"]').textContent=fmt(all);
        T.querySelector('[data-usd="'+c+'"]').textContent="$"+fmt(all/fx)});
      try{localStorage.setItem(KEY,JSON.stringify(state()))}catch(e){}
      updateLinks(tot,fx);
      return {tot:tot,fx:fx}}
    function hash(){return btoa(unescape(encodeURIComponent(JSON.stringify(state())))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
    function summary(tot,fx){var L=["ОРДА — расчёт съёмок от Taurus"];
      rows.forEach(function(row){var tv=num(row.querySelector(".tr"));if(tv!==null)L.push("• "+row.querySelector("b").textContent+": "+(num(row.querySelector(".sh"))||0)+" × "+fmt(tv)+" ₸")});
      L.push("Съёмки с резервом 10 %: Taurus "+fmt(tot.t*1.1)+" ₸ ≈ $"+fmt(tot.t*1.1/fx)+" (по рынку "+fmt(tot.m*1.1)+" ₸, эконом "+fmt(tot.e*1.1)+" ₸)");
      if(note.value.trim())L.push("Комментарий: "+note.value.trim());
      return L.join("\n")}
    function updateLinks(tot,fx){var link=MAIN+"#calc="+hash(),txt=summary(tot,fx);
      document.getElementById("calcTg").href="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(txt);
      document.getElementById("calcMail").href="mailto:"+MAIL+"?subject="+encodeURIComponent("ОРДА — расчёт съёмок от Taurus")+"&body="+encodeURIComponent(txt+"\n\nОткрыть расчёт: "+link)}
    var fromHash=null;
    if(location.hash.indexOf("#calc=")===0){try{fromHash=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(6).replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){}}
    if(fromHash){apply(fromHash)}else{try{apply(JSON.parse(localStorage.getItem(KEY)))}catch(e){}}
    T.addEventListener("input",calc);note.addEventListener("input",calc);calc();
    var msg=document.getElementById("calcMsg");function say(t){msg.textContent=t;setTimeout(function(){msg.textContent=""},4000)}
    function copy(t){if(navigator.clipboard)return navigator.clipboard.writeText(t);var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();return Promise.resolve()}
    document.getElementById("calcShare").addEventListener("click",function(){copy(location.origin+location.pathname+"#calc="+hash()).then(function(){say("Ссылка на вашу копию расчёта скопирована")})});
    document.getElementById("calcText").addEventListener("click",function(){var r=calc();copy(summary(r.tot,r.fx)).then(function(){say("Текст скопирован")})});
    document.getElementById("calcReset").addEventListener("click",function(){try{localStorage.removeItem(KEY)}catch(e){};location.hash="";location.reload()});
  }
  function err(t){document.getElementById("gerr").textContent=t}
  if(!(window.crypto&&crypto.subtle)){err("Браузер не поддерживает расшифровку. Откройте страницу по https.");return}
  var saved=null;try{saved=localStorage.getItem("orda_smeta_code")}catch(e){}
  if(saved){open(saved).catch(function(){try{localStorage.removeItem("orda_smeta_code")}catch(e){}})}
  function go(){var c=norm(document.getElementById("gcode").value);if(!c)return;err("Проверяю…");
    open(c).then(function(){try{localStorage.setItem("orda_smeta_code",c)}catch(e){}}).catch(function(){err("Неверный код")})}
  document.getElementById("gbtn").addEventListener("click",go);
  document.getElementById("gcode").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
})();
</script>
</body>
</html>
