<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ОРДА — купе</title>
<meta name="description" content="Закрытая рабочая страница. Вход по коду.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100D0A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--ground:#100D0A;--paper:#19140F;--ink:#F2EBDF;--muted:#B9AB97;--line:#352C24;--red:#C2362B;--gold:#C8952E;
  --display:"Unbounded",system-ui,"Segoe UI",sans-serif;--body:"Onest","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{display:block;width:100%;height:auto}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;margin:0}
.logo i,h1 i{font-style:normal;color:var(--red)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(56px,11vw,168px);line-height:.9;letter-spacing:-.05em;margin:0 0 18px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.6vw,64px);line-height:1.02;letter-spacing:-.04em;margin:0 0 18px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(24px,2.6vw,38px);letter-spacing:-.03em;line-height:1.05;margin:0 0 8px}
.h3s{font-size:clamp(20px,2vw,26px);font-weight:600;margin:clamp(64px,8vw,112px) 0 14px}
.sub,.lead{color:var(--muted);max-width:40em;margin:0}
.lead{font-size:clamp(17px,1.6vw,22px);color:var(--ink);max-width:28em}
.role{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 16px;font-weight:600}
.note{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:16px;max-width:46em}

.bar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);background:linear-gradient(#100D0Aee,#100D0A00)}
.bar span{display:flex;gap:clamp(14px,3vw,32px)}
.bar span a{font-size:14px;font-weight:600;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
.bar span a:hover{border-color:var(--red)}

.cover{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.cover>a{position:absolute;inset:0}
.cover>a img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#100D0A 4%,#100D0Acc 26%,#100D0A00 62%);pointer-events:none}
.covertext{position:relative;z-index:2;width:100%;padding-bottom:clamp(36px,7vw,88px);pointer-events:none}

section{padding:clamp(72px,10vw,150px) 0}
section.alt{background:var(--paper);padding-top:0}
.bleed{margin-bottom:clamp(56px,8vw,112px)}
.bleed img{max-height:86svh;object-fit:cover}

.who{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,64px);align-items:center;margin-top:clamp(64px,9vw,128px)}
.who.flip .face{order:2}
.who .about p:not(.role){max-width:30em;margin:0 0 28px;color:var(--muted)}
.angles{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.75fr)}
.angles a{aspect-ratio:3/4;overflow:hidden}.angles a:last-child{aspect-ratio:9/16}
.angles img{height:100%;object-fit:cover;object-position:50% 12%}
.zoom{display:block;cursor:zoom-in;overflow:hidden;background:#0a0806}
.zoom img{transition:transform .6s cubic-bezier(.16,1,.3,1)}
.zoom:hover img{transform:scale(1.025)}

figure{margin:0}
figcaption{font-size:15px;color:var(--muted);padding-top:10px;line-height:1.4}
figcaption b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.pair{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);gap:clamp(12px,2vw,24px);align-items:end;margin-top:clamp(40px,6vw,80px)}
.pair.rev{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);margin-top:clamp(64px,9vw,128px)}
.pair.rev .about p:not(.role){color:var(--muted);max-width:26em;margin:0}
.pair.rev.tall{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,6fr)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,28px);margin-top:28px}
.trio figure{display:grid;grid-template-columns:1.35fr 1fr;gap:6px}
.trio figure a{height:100%}.trio figure img{height:100%;object-fit:cover}
.trio figcaption{grid-column:1/-1}
.blood{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,28px);max-width:980px;margin-top:28px}
.gap{height:clamp(28px,4vw,48px)}
.frames.lead figure:first-child{grid-column:1/-1}
.frames{display:grid;gap:clamp(18px,2.4vw,32px) clamp(10px,1.4vw,18px)}
.frames.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.frames.three{grid-template-columns:repeat(3,minmax(0,1fr))}

footer{padding:56px 0 72px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
footer .logo{color:var(--ink);margin-bottom:10px}
footer p{margin:0}

#lb{position:fixed;inset:0;z-index:50;background:#070504f2;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{width:auto;max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;top:10px;right:14px;width:48px;height:48px;border:0;background:none;color:var(--ink);font-size:34px;cursor:pointer}

.gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:380px}
.gate h3{font-size:44px;font-weight:800;margin:0 0 10px}.gate h3 i{font-style:normal;color:var(--red)}
.gate p{color:var(--muted);margin:0 0 18px}.gate .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.gate input{width:100%;font:600 18px var(--body);letter-spacing:.12em;padding:14px 16px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;margin-bottom:12px}
.gate input:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;min-height:52px;border:0;border-radius:10px;background:var(--red);color:#fff;font:600 16px var(--body);cursor:pointer}
.err{min-height:24px;margin-top:10px;font-size:15px;color:var(--gold)}

@media (max-width:820px){
  body{font-size:17px}
  .who{grid-template-columns:1fr;align-items:start}.who.flip .face{order:0}
  .pair{grid-template-columns:1fr}.pair.rev{grid-template-columns:1fr 1fr}.pair.rev.tall{grid-template-columns:4fr 3fr}.pair.rev .about{grid-column:1/-1}
  .trio{grid-template-columns:1fr;gap:36px}
  .frames.two,.frames.three{grid-template-columns:1fr}
  .cover>a img{object-position:38% 40%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.zoom img{transition:none}}

.dec{padding:clamp(56px,8vw,112px) 0 0}
.dec h2{font-size:clamp(28px,4vw,56px)}
.ppl{display:grid;gap:clamp(10px,1.6vw,20px);margin-top:28px}.ppl.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.ppl a{aspect-ratio:3/4}.ppl img{height:100%;object-fit:cover;object-position:50% 15%}
.dec .frames{margin-top:24px}
.zoom[data-cine]{aspect-ratio:2.39/1;background:#000}.zoom[data-cine] img{width:100%;height:100%;object-fit:cover}
.tw{overflow-x:auto;margin-top:24px;-webkit-overflow-scrolling:touch}
.tb{width:100%;border-collapse:collapse;font-size:16px;line-height:1.45}
.tb th{text-align:left;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:0 12px 10px 0;border-bottom:1.5px solid var(--line)}
.tb td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tb td:first-child{color:var(--ink)}.tb td b{color:var(--ink)}
.tb.money td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.tb.rep td:first-child{white-space:nowrap;color:var(--gold)}.tb.rep td:nth-child(3),.tb.rep td:nth-child(4){color:var(--ink)}.tb.rep td:last-child{text-align:right}
.note{margin:24px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:16px;max-width:52em}
.bar{background:linear-gradient(#100D0A 50%,#100D0A00);padding-bottom:26px}
footer{margin-top:clamp(72px,10vw,140px)}
.chat{max-width:860px;margin-top:24px}
.cl{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px 0}
.cm{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.cm.mine{border-color:var(--gold)}
.ch{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
.ch b{color:var(--ink);font-weight:600}.ch button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px;padding:0}
.cm p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.5;color:var(--ink)}
.cempty{color:var(--muted);font-size:15px;margin:0}
.cf{display:grid;gap:10px;margin-top:16px}
.cf input,.cf textarea{width:100%;font:16px var(--body);padding:12px 14px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;resize:vertical}
.cf input:focus,.cf textarea:focus{outline:none;border-color:var(--gold)}
.crow{display:flex;align-items:center;gap:14px}.crow .btn{width:auto;padding:0 24px}
.cstat{font-size:14px;color:var(--muted)}
@media (max-width:820px){.ppl.four{grid-template-columns:repeat(2,minmax(0,1fr))}.tb{font-size:15px}.tb.rep thead{display:none}.tb.rep tr{display:grid;grid-template-columns:44px 1fr;column-gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.tb.rep td{border:0;padding:2px 0}.tb.rep td:nth-child(3),.tb.rep td:nth-child(4){grid-column:1/-1}.tb.rep td:nth-child(4){color:var(--gold)}.tb.rep td:last-child{display:none}}
</style>
</head>

<script>
(function(){
  var P=JSON.parse(document.getElementById("payload").textContent);
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function norm(v){return (v||"").replace(/\s+/g,"").toUpperCase()}
  function chat(code){
    var root=document.getElementById("cl");if(!root)return;
    var API=(location.hostname==="localhost"?"http://localhost:3080":"https://welluma.ru")+"/orda-chat/api/rooms/kupe/messages";
    var tok=null,name="";try{tok=localStorage.getItem("orda_chat_token");name=localStorage.getItem("orda_chat_name")||""}catch(e){}
    if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem("orda_chat_token",tok)}catch(e){}}
    var cn=document.getElementById("cn"),ct=document.getElementById("ct"),cs=document.getElementById("cs");cn.value=name;
    var H={"X-Code":code,"X-Token":tok};
    function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
    function when(iso){var d=new Date(iso);return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
    function render(list){
      if(!list.length){root.innerHTML='<p class="cempty">Пока пусто. Первое слово за вами.</p>';return}
      root.innerHTML=list.map(function(m){return '<div class="cm'+(m.mine?" mine":"")+'" data-id="'+m.id+'"><div class="ch"><span><b>'+esc(m.name)+'</b> · '+when(m.at)+'</span>'+(m.mine?'<button type="button" data-del="'+m.id+'">удалить</button>':"")+'</div><p>'+esc(m.text)+'</p></div>'}).join("");
      root.scrollTop=root.scrollHeight;
    }
    function load(){fetch(API,{headers:H}).then(function(r){return r.json()}).then(function(j){if(j.messages)render(j.messages);else root.innerHTML='<p class="cempty">'+esc(j.error||"Ошибка")+'</p>'})
      .catch(function(){root.innerHTML='<p class="cempty">Чат пока не подключён: сервер не отвечает.</p>'})}
    document.getElementById("cf").addEventListener("submit",function(e){e.preventDefault();
      var n=cn.value.trim(),x=ct.value.trim();if(!n||!x)return;try{localStorage.setItem("orda_chat_name",n)}catch(e){}
      cs.textContent="Отправляю…";
      fetch(API,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify({name:n,text:x})})
        .then(function(r){return r.json()}).then(function(j){if(j.id){ct.value="";cs.textContent="";load()}else cs.textContent=j.error||"Не отправилось"})
        .catch(function(){cs.textContent="Сервер не отвечает"});
    });
    root.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-del]");if(!b)return;
      if(!confirm("Удалить своё сообщение?"))return;
      fetch(API+"/"+b.dataset.del,{method:"DELETE",headers:H}).then(function(){load()});
    });
    load();setInterval(load,15000);
  }
  function lightbox(){
    var lb=document.getElementById("lb");if(!lb)return;var im=lb.querySelector("img");
    function close(){lb.hidden=true;im.removeAttribute("src")}
    document.getElementById("app").addEventListener("click",function(e){
      var a=e.target.closest&&e.target.closest("a.zoom");
      if(a){e.preventDefault();im.src=a.getAttribute("href");im.alt=a.querySelector("img").alt;lb.hidden=false;return}
      if(e.target.closest&&e.target.closest("#lb"))close();
    });
    document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
  }
  async function open(code){
    var te=new TextEncoder();
    var km=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
    document.getElementById("app").innerHTML=new TextDecoder().decode(pt);
    document.getElementById("gate").remove();lightbox();if(typeof chat==="function")chat(code);
  }
  function err(t){document.getElementById("gerr").textContent=t}
  if(!(window.crypto&&crypto.subtle)){err("Браузер не поддерживает расшифровку. Откройте страницу по https.");return}
  var saved=null;try{saved=localStorage.getItem("orda_kupe_code")}catch(e){}
  if(saved){open(saved).catch(function(){try{localStorage.removeItem("orda_kupe_code")}catch(e){}})}
  function go(){var c=norm(document.getElementById("gcode").value);if(!c)return;err("Проверяю…");
    open(c).then(function(){try{localStorage.setItem("orda_kupe_code",c)}catch(e){}}).catch(function(){err("Неверный код")})}
  document.getElementById("gbtn").addEventListener("click",go);
  document.getElementById("gcode").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
})();
</script>
