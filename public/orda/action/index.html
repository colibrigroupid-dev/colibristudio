<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ОРДА — пример экшен-сцены</title>
<meta name="description" content="ОРДА: пример экшен-сцены — бой в юрте.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100D0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--ground:#100D0A;--paper:#19140F;--ink:#F2EBDF;--muted:#B9AB97;--line:#352C24;--red:#C2362B;--gold:#C8952E;
  --display:"Unbounded",system-ui,"Segoe UI",sans-serif;--body:"Onest","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,48px)}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;margin:0}
.logo i,h1 i{font-style:normal;color:var(--red)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,120px);line-height:.92;letter-spacing:-.05em;margin:0 0 18px}
.lead{font-size:clamp(17px,1.6vw,22px);max-width:34em;margin:0;color:var(--muted)}
header.hero{padding-block:clamp(40px,7vw,96px) clamp(28px,4vw,48px)}
.film{background:#000;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.film video{display:block;width:100%;height:auto;aspect-ratio:1920/828;background:#000}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(16px,3vw,40px);padding-block:clamp(32px,5vw,64px) clamp(64px,8vw,120px)}
.meta div{border-top:1px solid var(--line);padding-top:14px}
.meta b{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.meta span{color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div class="bar"><p class="logo">ОРДА<i>.</i></p></div>
<header class="hero wrap">
  <p class="eyebrow">Пример экшен-сцены</p>
  <h1>Бой в&nbsp;юрте<i>.</i></h1>
  <p class="lead">Пример экшен-сцены для фильма «Орда»: драка в&nbsp;замкнутом пространстве юрты.</p>
</header>
<div class="film">
  <video controls playsinline preload="none" poster="assets/orda-action-poster.jpg">
    <source src="assets/orda-action-1920.mp4" type="video/mp4">
  </video>
</div>
<div class="wrap meta">
  <div><b>Длительность</b><span>1 мин 35 с</span></div>
  <div><b>Формат</b><span>2.39:1, звук</span></div>
  <div><b>Обработка</b><span>Апскейл Topaz Video AI, модель Iris</span></div>
</div>
</body>
</html>
